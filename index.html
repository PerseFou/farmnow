  { id:2, name:'Carottes nouvelles',  name_en:'Baby carrots',            farm:2, cat:'Légumes',        price:2.80,  unit:'1 kg',   color:'#d4621a', desc:'Carottes tendres et sucrées, parfaites en crudités ou rôties au four avec du miel de nos ruches.',              img:'https://images.unsplash.com/photo-1445282768818-728615cc910a?w=400&h=400&fit=crop' },
  { id:3, name:'Fraises de saison',   name_en:'Seasonal strawberries',   farm:4, cat:'Fruits',         price:4.50,  unit:'400 g',  color:'#b82a40', desc:'Fraises Elsanta cueillies à maturité. Sucrées, parfumées, à consommer dans les 48 h.',                          img:'https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=400&h=400&fit=crop' },
  { id:4, name:'Pommes Golden',       name_en:'Golden apples',           farm:3, cat:'Fruits',         price:3.20,  unit:'1 kg',   color:'#b88a10', desc:'Pommes Golden du verger de La Ferme Verte, croquantes et légèrement acidulées. Cueillie à la main.',             img:'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400&h=400&fit=crop' },
  { id:5, name:'Poulet fermier',      name_en:'Free-range chicken',      farm:1, cat:'Viandes',        price:14.50, unit:'pièce',  color:'#8a4a18', desc:'Poulet élevé en plein air, nourri aux céréales locales. Label rouge. Idéal rôti au four avec des herbes fraîches.', img:'https://images.unsplash.com/photo-1587593810167-a84920ea0781?w=400&h=400&fit=crop' },
  { id:6, name:'Œufs bio (×12)',      name_en:'Organic eggs (×12)',      farm:2, cat:'Œufs & Laitages', price:4.80,  unit:'boîte',  color:'#c89a10', desc:'Œufs de poules élevées en plein air, certifiés bio. Jaune intense et goût authentique.',                       img:'https://images.unsplash.com/photo-1582722872445-44dc5f7e3c8f?w=400&h=400&fit=crop' },
  { id:7, name:'Fromage de chèvre',   name_en:'Goat cheese',             farm:3, cat:'Œufs & Laitages', price:5.50,  unit:'pièce',  color:'#8a7a5a', desc:'Fromage frais de chèvre affiné 10 jours. Onctueux, légèrement acidulé. Parfait sur une tartine grillée.',       img:'https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=400&h=400&fit=crop' },

// ─── ICONS ────────────────────────────────────────────────────

  Search: ({c,s=24}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke={c} strokeWidth="2"/><path d="M16.5 16.5L21 21" stroke={c} strokeWidth="2" strokeLinecap="round"/></svg>,

  User: ({c,s=24}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke={c} strokeWidth="2"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke={c} strokeWidth="2" strokeLinecap="round"/></svg>,

  Check: ({c=T.white,s=16}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke={c} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Star: ({s=12}) => <svg width={s} height={s} viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#f4b942" stroke="#f4b942" strokeWidth="1"/></svg>,
  Pin: ({c=T.muted,s=12}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke={c} strokeWidth="2"/><circle cx="12" cy="9" r="2.5" stroke={c} strokeWidth="2"/></svg>,
  Trash: ({c='#d44',s=16}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Leaf: ({c=T.green,s=14}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><path d="M12 22c0-6-4-10-10-10 0 6 4 10 10 10z" fill={c} opacity=".3"/><path d="M12 22C12 16 16 12 22 12c0 6-4 10-10 10z" fill={c}/><path d="M12 22V10" stroke={c} strokeWidth="1.5" strokeLinecap="round"/></svg>,
  Truck: ({c=T.white,s=22}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><rect x="1" y="6" width="14" height="11" rx="1.5" stroke={c} strokeWidth="1.8"/><path d="M15 9h4l3 4v4h-7V9z" stroke={c} strokeWidth="1.8" strokeLinejoin="round"/><circle cx="5.5" cy="19.5" r="1.8" fill={c}/><circle cx="18.5" cy="19.5" r="1.8" fill={c}/></svg>,
  Clock: ({c=T.muted,s=14}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke={c} strokeWidth="1.8"/><path d="M12 7v5l3 3" stroke={c} strokeWidth="1.8" strokeLinecap="round"/></svg>,

  ChevronR: ({c=T.muted,s=14}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
};

// ─── SHARED ───────────────────────────────────────────────────
function BottomNav({ active, onNav, cartCount = 0 }) {
  const tabs = [
    { id:'home',    Icon:IC.Home,   label:'Accueil' },
    { id:'search',  Icon:IC.Search, label:'Explorer' },
    { id:'cart',    Icon:IC.Cart,   label:'Panier', badge: cartCount },
    { id:'profile', Icon:IC.User,   label:'Profil' },
  ];
  return (
    <div style={{ display:'flex', background:T.white, borderTop:`1px solid ${T.border}`, paddingBottom:28, paddingTop:10, flexShrink:0 }}>
      {tabs.map(t => (
        <div key={t.id} onClick={() => onNav(t.id)} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3, cursor:'pointer', position:'relative' }}>
          <t.Icon c={active === t.id ? T.green : '#c0c0b0'} s={22}/>
          {t.badge > 0 && <div style={{ position:'absolute', top:-2, right:'22%', width:16, height:16, borderRadius:'50%', background:T.terra, fontSize:9, fontWeight:800, color:T.white, display:'flex', alignItems:'center', justifyContent:'center' }}>{t.badge}</div>}
          <span style={{ fontSize:10, color:active === t.id ? T.green : '#c0c0b0', fontWeight: active === t.id ? 700 : 400 }}>{t.label}</span>
        </div>
      ))}
    </div>
  );
}

function Img({ src, style = {} }) {
  return <img src={src} style={{ objectFit:'cover', ...style }} loading="lazy" />;
}

// ─── 1. SPLASH ────────────────────────────────────────────────
function SplashScreen({ onDone }) {
  const [step, setStep] = useState(0);
  const s = SPLASH_SLIDES[step];
  return (
    <div style={{ height:'100%', position:'relative', overflow:'hidden' }}>
      {/* Background photo */}
      <Img src={s.bg} style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}/>
      {/* Dark gradient overlay */}
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, rgba(10,20,8,0.25) 0%, rgba(10,20,8,0.72) 60%, rgba(10,20,8,0.92) 100%)' }}/>

      {/* Content */}
      <div style={{ position:'relative', zIndex:2, height:'100%', display:'flex', flexDirection:'column', justifyContent:'flex-end', padding:'0 28px 52px' }}>
        {/* Logo pill */}
        <div style={{ position:'absolute', top:70, left:28, display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:38, height:38, borderRadius:12, background:'rgba(255,255,255,0.18)', backdropFilter:'blur(8px)', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <IC.Leaf c={T.white} s={20}/>
          </div>
          <span style={{ fontSize:18, fontWeight:800, color:T.white, letterSpacing:-0.3 }}>FarmNow</span>
        </div>

        <div style={{ fontSize:30, fontWeight:800, color:T.white, letterSpacing:-0.5, lineHeight:1.2, whiteSpace:'pre-line', marginBottom:12 }}>{s.title}</div>
        <div style={{ fontSize:15, color:'rgba(255,255,255,0.72)', lineHeight:1.6, marginBottom:36 }}>{s.sub}</div>

        {/* Dots */}
        <div style={{ display:'flex', gap:7, marginBottom:28 }}>
          {SPLASH_SLIDES.map((_,i) => (
            <div key={i} style={{ height:4, width: i===step ? 28 : 8, borderRadius:2, background: i===step ? T.terra : 'rgba(255,255,255,0.35)', transition:'all 0.3s' }}/>
          ))}
        </div>

        <button onClick={() => step < SPLASH_SLIDES.length-1 ? setStep(step+1) : onDone()} style={{
          width:'100%', height:56, borderRadius:18, border:'none',
          background:T.terra, fontSize:17, fontWeight:700, color:T.white, cursor:'pointer',
          letterSpacing:0.1,
        }}>
          {step < SPLASH_SLIDES.length-1 ? 'Suivant' : 'Commencer / Get Started'}
        </button>
        {step < SPLASH_SLIDES.length-1 && (
          <div onClick={onDone} style={{ textAlign:'center', marginTop:16, color:'rgba(255,255,255,0.45)', fontSize:14, cursor:'pointer' }}>Passer / Skip</div>
        )}
      </div>
    </div>
  );
}

// ─── 2. HOME ──────────────────────────────────────────────────
function HomeScreen({ onProduct, cartCount, onNav }) {
  const [cat, setCat] = useState('Tout');
  const filtered = cat === 'Tout' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:T.cream }}>
      <div style={{ flex:1, overflowY:'auto' }}>
        {/* Header */}
        <div style={{ background:T.green, padding:'64px 20px 20px' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
            <div>
              <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:2 }}>
                <IC.Pin c="rgba(255,255,255,0.55)" s={12}/>
                <span style={{ fontSize:12, color:'rgba(255,255,255,0.55)' }}>Bruxelles &amp; alentours</span>
              </div>
              <div style={{ fontSize:22, fontWeight:800, color:T.white, letterSpacing:-0.3 }}>Bonjour, Marie</div>
            </div>
            <div style={{ position:'relative', cursor:'pointer' }} onClick={() => onNav('cart')}>
              <div style={{ width:44, height:44, borderRadius:14, background:'rgba(255,255,255,0.14)', display:'flex', alignItems:'center', justifyContent:'center' }}>
                <IC.Cart c={T.white} s={22}/>
              </div>
              {cartCount > 0 && <div style={{ position:'absolute', top:-4, right:-4, width:18, height:18, borderRadius:'50%', background:T.terra, fontSize:10, fontWeight:800, color:T.white, display:'flex', alignItems:'center', justifyContent:'center' }}>{cartCount}</div>}
            </div>
          </div>
          <div style={{ background:T.white, borderRadius:14, padding:'0 14px', display:'flex', alignItems:'center', gap:10, height:46 }}>
            <IC.Search c={T.muted} s={18}/>
            <span style={{ color:T.muted, fontSize:14 }}>Chercher un produit ou une ferme…</span>
          </div>
        </div>

        {/* Promo banner */}
        <div style={{ margin:'16px 16px 0', borderRadius:18, overflow:'hidden', position:'relative', height:100 }}>
          <Img src="https://images.unsplash.com/photo-1488459716781-31db52582fe9?w=800&h=300&fit=crop&crop=center" style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}/>
          <div style={{ position:'absolute', inset:0, background:'linear-gradient(to right, rgba(200,97,58,0.92) 50%, rgba(200,97,58,0.5) 100%)' }}/>
          <div style={{ position:'relative', zIndex:1, padding:'18px 20px', display:'flex', justifyContent:'space-between', alignItems:'center', height:'100%' }}>
            <div>
              <div style={{ fontSize:10, color:'rgba(255,255,255,0.8)', fontWeight:700, letterSpacing:1.2, textTransform:'uppercase', marginBottom:4 }}>Promotion</div>
              <div style={{ fontSize:16, fontWeight:800, color:T.white, lineHeight:1.3 }}>Livraison gratuite<br/>dès €30 d'achat</div>
            </div>
            <IC.Truck c={T.white} s={40}/>
          </div>
        </div>

        {/* Category filters */}
        <div style={{ overflowX:'auto', display:'flex', gap:8, padding:'16px 16px 8px' }}>
          {CATS.map(c => (
            <div key={c} onClick={() => setCat(c)} style={{
              padding:'7px 16px', borderRadius:10, flexShrink:0, cursor:'pointer',
              background: cat===c ? T.green : T.white,
              color: cat===c ? T.white : T.muted,
              fontWeight: cat===c ? 700 : 500, fontSize:13,
              border:`1px solid ${cat===c ? T.green : T.border}`,
              transition:'all 0.2s',
            }}>{c}</div>
          ))}
        </div>

        {/* Products */}
        <div style={{ padding:'4px 16px 16px' }}>
          <div style={{ fontSize:15, fontWeight:700, color:T.text, marginBottom:12 }}>
            {cat === 'Tout' ? 'Produits du moment' : cat}
          </div>
          <div style={{ overflowX:'auto', display:'flex', gap:12, paddingBottom:4 }}>
            {filtered.map(p => (
              <div key={p.id} onClick={() => onProduct(p)} style={{ background:T.white, borderRadius:18, overflow:'hidden', boxShadow:'0 2px 12px rgba(0,0,0,0.07)', cursor:'pointer', flexShrink:0, width:156 }}>
                <div style={{ height:110, overflow:'hidden', position:'relative' }}>
                  <Img src={p.img} style={{ width:'100%', height:'100%' }}/>
                </div>
                <div style={{ padding:'10px 12px 12px' }}>
                  <div style={{ fontSize:13, fontWeight:700, color:T.text, lineHeight:1.3, marginBottom:2 }}>{p.name}</div>
                  <div style={{ fontSize:11, color:T.muted, marginBottom:8 }}>{FARMS.find(f=>f.id===p.farm)?.name}</div>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                    <span style={{ fontSize:15, fontWeight:800, color:T.green }}>€{p.price.toFixed(2)}</span>
                    <span style={{ fontSize:11, color:T.muted }}>{p.unit}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Partner farms */}
        <div style={{ padding:'4px 16px 32px' }}>
          <div style={{ fontSize:15, fontWeight:700, color:T.text, marginBottom:12 }}>Nos fermes partenaires</div>
          {FARMS.map(f => (
            <div key={f.id} style={{ background:T.white, borderRadius:16, padding:'12px', marginBottom:10, display:'flex', alignItems:'center', gap:12, boxShadow:'0 1px 8px rgba(0,0,0,0.05)' }}>
              <div style={{ width:52, height:52, borderRadius:14, overflow:'hidden', flexShrink:0 }}>
                <Img src={f.img} style={{ width:'100%', height:'100%' }}/>
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{f.name}</div>
                <div style={{ fontSize:12, color:T.muted, display:'flex', alignItems:'center', gap:4, marginTop:2 }}>
                  <IC.Pin c={T.muted} s={11}/> {f.location} · {f.distance}
                </div>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                <IC.Star s={13}/><span style={{ fontSize:12, fontWeight:700, color:T.text }}>{f.rating}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
      <BottomNav active="home" onNav={onNav} cartCount={cartCount}/>
    </div>
  );
}

// ─── 3. PRODUCT DETAIL ────────────────────────────────────────
function ProductScreen({ product, onBack, onAddToCart, cartItems }) {
  const farm = FARMS.find(f => f.id === product.farm);
  const inCart = cartItems.find(i => i.id === product.id);

// ─── ROOT APP ─────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState(() => localStorage.getItem('fn_screen') || 'splash');
  const [product, setProduct] = useState(null);
  const [cart, setCart] = useState(() => { try { return JSON.parse(localStorage.getItem('fn_cart') || '[]'); } catch { return []; } });

  useEffect(() => { localStorage.setItem('fn_screen', screen); }, [screen]);
  useEffect(() => { localStorage.setItem('fn_cart', JSON.stringify(cart)); }, [cart]);

  function addToCart(p, qty) {
    setCart(prev => {
      const ex = prev.find(i => i.id === p.id);
      return ex ? prev.map(i => i.id===p.id ? {...i, qty:i.qty+qty} : i) : [...prev, {...p, qty}];
    });
  }
  function nav(s) { setScreen(s); if (s !== 'product') setProduct(null); }

  const cartCount = cart.reduce((s,i) => s+i.qty, 0);

  return (
    <IOSDevice width={393} height={852}>
      {screen==='splash'   && <SplashScreen onDone={() => nav('home')}/>}
      {screen==='home'     && <HomeScreen onProduct={p => { setProduct(p); nav('product'); }} cartCount={cartCount} onNav={nav}/>}
      {screen==='product'  && product && <ProductScreen product={product} onBack={() => nav('home')} onAddToCart={addToCart} cartItems={cart}/>}
      {screen==='cart'     && <CartScreen cartItems={cart} onRemove={id => setCart(c=>c.filter(i=>i.id!==id))} onChangeQty={(id,q) => { if(q<1){setCart(c=>c.filter(i=>i.id!==id));return;} setCart(c=>c.map(i=>i.id===id?{...i,qty:q}:i)); }} onCheckout={() => nav('checkout')} onBack={() => nav('home')}/>}
      {screen==='checkout' && <CheckoutScreen cartItems={cart} onConfirm={() => { setCart([]); nav('home'); }} onBack={() => nav('cart')}/>}
      {screen==='profile'  && <ProfileScreen onNav={nav}/>}
      {screen==='search'   && <HomeScreen onProduct={p => { setProduct(p); nav('product'); }} cartCount={cartCount} onNav={nav}/>}
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
