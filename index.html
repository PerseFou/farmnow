// ─── LIVRAISON EXPRESS LOGIC ───────────────────────────────────
// Heure Brussels (Europe/Brussels = UTC+1 en hiver, UTC+2 en été)
function getBrusselsHour() {
  const now = new Date();
  // Utilise l'heure locale du navigateur si c'est à Bruxelles,
  // sinon on simule bien avec toLocaleString
  const brusselStr = now.toLocaleString('fr-BE', { timeZone: 'Europe/Brussels', hour: '2-digit', minute: '2-digit', hour12: false });
  const [h, m] = brusselStr.split(':').map(Number);
  return { hour: h, minute: m };
}

function getDeliverySlots() {
  const { hour, minute } = getBrusselsHour();
  const nowMinutes = hour * 60 + minute;

  // Définition des créneaux : [labelFR, startH, endH, cutoffH, cutoffM]
  // cutoff = heure limite pour commander ce créneau
  const ALL_SLOTS = [
    { label: "Aujourd'hui  12h – 14h", day: 'today',     start: 12, end: 14, cutoffH: 10, cutoffM: 0  },
    { label: "Aujourd'hui  17h – 19h", day: 'today',     start: 17, end: 19, cutoffH: 15, cutoffM: 0  },
    { label: "Aujourd'hui  19h – 21h", day: 'today',     start: 19, end: 21, cutoffH: 17, cutoffM: 0  },
    { label: "Demain  8h – 10h",       day: 'tomorrow',  start:  8, end: 10, cutoffH: 99, cutoffM: 0  },
    { label: "Demain  12h – 14h",      day: 'tomorrow',  start: 12, end: 14, cutoffH: 99, cutoffM: 0  },
    { label: "Demain  17h – 19h",      day: 'tomorrow',  start: 17, end: 19, cutoffH: 99, cutoffM: 0  },
  ];

  return ALL_SLOTS.map(s => {
    let available = true;
    let urgency = null; // 'soon', 'last', null

    if (s.day === 'today') {
      const cutoffMinutes = s.cutoffH * 60 + s.cutoffM;
      const minutesLeft = cutoffMinutes - nowMinutes;
      if (minutesLeft <= 0) {
        available = false; // créneau passé
      } else if (minutesLeft <= 60) {
        urgency = 'last'; // moins d'1h pour commander
      } else if (minutesLeft <= 120) {
        urgency = 'soon'; // moins de 2h
      }
    }

    return { ...s, available, urgency };
  }).filter(s => s.available);
}

function getNextSlotCountdown() {
  const { hour, minute } = getBrusselsHour();
  const nowMinutes = hour * 60 + minute;
  const slots = getDeliverySlots();
  const todaySlots = slots.filter(s => s.day === 'today');
  if (todaySlots.length === 0) return null;

  const next = todaySlots[0];
  const cutoffMinutes = next.cutoffH * 60 + next.cutoffM;
  const diff = cutoffMinutes - nowMinutes;
  if (diff <= 0) return null;

  const h = Math.floor(diff / 60);
  const m = diff % 60;
  return { label: next.label, h, m, urgency: next.urgency };
}

function isExpressAvailableToday() {
  const slots = getDeliverySlots();
  return slots.some(s => s.day === 'today');
}

// ─── COMPOSANT : BANNIÈRE EXPRESS ─────────────────────────────
function ExpressBanner() {
  const [countdown, setCountdown] = useState(getNextSlotCountdown());
  const [tick, setTick] = useState(false);

  useEffect(() => {
    const id = setInterval(() => {
      setCountdown(getNextSlotCountdown());
      setTick(t => !t);
    }, 60000);
    return () => clearInterval(id);
  }, []);

  if (!countdown) return null;

  const isUrgent = countdown.urgency === 'last';

  return (
    <div style={{
      margin:'12px 16px 0', borderRadius:16, overflow:'hidden',
      background: isUrgent
        ? 'linear-gradient(135deg, #c8402a 0%, #e84c1e 100%)'
        : 'linear-gradient(135deg, #3d5c35 0%, #5a7a4e 100%)',
      padding:'12px 16px',
      display:'flex', alignItems:'center', gap:12,
      animation:'slide-up 0.4s ease',
    }}>
      {/* Dot clignotant */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        <div style={{ width:8, height:8, borderRadius:'50%', background:'rgba(255,255,255,0.9)', animation:'pulse-dot 1.4s ease-in-out infinite' }}/>
      </div>
      <div style={{ flex:1 }}>
        <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:2 }}>
          <IC.Lightning c="rgba(255,255,255,0.9)" s={11}/>
          <span style={{ fontSize:10, fontWeight:800, color:'rgba(255,255,255,0.85)', letterSpacing:1.1, textTransform:'uppercase' }}>
            {isUrgent ? 'Dernière chance !' : 'Livraison express'}
          </span>
        </div>
        <div style={{ fontSize:13, fontWeight:700, color:'#fff', lineHeight:1.3 }}>
          {countdown.label}
        </div>
      </div>
      <div style={{ textAlign:'center', background:'rgba(0,0,0,0.18)', borderRadius:12, padding:'7px 12px', flexShrink:0 }}>
        <div style={{ fontSize:18, fontWeight:900, color:'#fff', lineHeight:1, fontVariantNumeric:'tabular-nums' }}>
          {countdown.h > 0 ? `${countdown.h}h${String(countdown.m).padStart(2,'0')}` : `${countdown.m}min`}
        </div>
        <div style={{ fontSize:9, color:'rgba(255,255,255,0.6)', marginTop:2, fontWeight:600 }}>pour commander</div>
      </div>
    </div>
  );
}

              <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                <div style={{ width:22, height:22, borderRadius:'50%', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', background: step>=i ? T.green : T.tag, color: step>=i ? T.white : T.muted }}>
                  {step > i ? <IC.Check c={T.white} s={12}/> : i+1}
                </div>
                <span style={{ fontSize:12, fontWeight:600, color: step>=i ? T.green : T.muted }}>{s}</span>
              </div>
            </React.Fragment>
          ))}
        </div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'16px' }}>
        {step === 0 && (
          <div>
            {/* Commune */}
            <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:10, display:'flex', alignItems:'center', gap:6 }}>
              <IC.Pin c={T.green} s={14}/> Commune de livraison
            </div>
            <div style={{ background:T.white, borderRadius:14, padding:'4px 6px', marginBottom:10, maxHeight:160, overflowY:'auto', display:'flex', flexWrap:'wrap', gap:6 }}>
              {COMMUNES_BXL.map(c => (
                <div key={c} onClick={() => setCommune(c)} style={{
                  padding:'6px 12px', borderRadius:10, cursor:'pointer', fontSize:12, fontWeight:600,
                  background: commune===c ? T.green : T.tag,
                  color: commune===c ? T.white : T.text,
                  border:`1.5px solid ${commune===c ? T.green : 'transparent'}`,
                  transition:'all 0.2s',
                }}>{c}</div>
              ))}
            </div>

            {/* Rue */}
            <input
              placeholder="Rue et numéro"
              value={rue}
              onChange={e => setRue(e.target.value)}
              style={{ width:'100%', height:46, borderRadius:14, border:`1.5px solid ${T.border}`, padding:'0 14px', fontSize:14, color:T.text, background:T.white, outline:'none', fontFamily:'inherit', marginBottom:18 }}
            />

            {/* Créneaux dynamiques */}
            <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:10, display:'flex', alignItems:'center', gap:6 }}>
              <IC.Clock c={T.green} s={14}/> Créneau de livraison
            </div>

            {slots.length === 0 ? (
              <div style={{ background:'#fff0ec', borderRadius:14, padding:'14px 16px', border:`1px solid #f5c0a8` }}>
                <div style={{ fontSize:13, fontWeight:700, color:T.express, marginBottom:4 }}>Plus de livraison express ce soir</div>
                <div style={{ fontSize:12, color:T.muted }}>Les créneaux du jour sont passés. Des créneaux seront disponibles demain à partir de 8h.</div>
              </div>
            ) : (
              slots.map((s, i) => (
                <div key={i} onClick={() => setSelectedSlot(i)} style={{
                  background:T.white, borderRadius:14, padding:'13px 16px', marginBottom:10,
                  display:'flex', alignItems:'center', justifyContent:'space-between',
                  border:`1.5px solid ${selectedSlot===i ? T.green : T.border}`,
                  cursor:'pointer', transition:'border 0.2s',
                }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:3 }}>
                      <span style={{ fontSize:14, color:T.text, fontWeight: selectedSlot===i ? 700 : 400 }}>{s.label}</span>
                      {s.urgency === 'last' && (
                        <div style={{ background:'#fff0ec', borderRadius:6, padding:'1px 6px', display:'flex', alignItems:'center', gap:3 }}>
                          <IC.Lightning c={T.express} s={9}/>
                          <span style={{ fontSize:9, fontWeight:800, color:T.express }}>Dernière chance</span>
                        </div>
                      )}
                      {s.urgency === 'soon' && (
                        <div style={{ background:T.tag, borderRadius:6, padding:'1px 6px' }}>
                          <span style={{ fontSize:9, fontWeight:700, color:T.green }}>Bientôt fermé</span>
                        </div>
                      )}
                    </div>
                    <div style={{ fontSize:11, color:T.muted }}>
                      {s.day === 'today' ? `Commandez avant ${s.cutoffH}h` : 'Disponible'}
                    </div>
                  </div>
                  <div style={{ width:20, height:20, borderRadius:'50%', border:`2px solid ${selectedSlot===i ? T.green : T.border}`, background: selectedSlot===i ? T.green : 'transparent', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                    {selectedSlot===i && <IC.Check c={T.white} s={10}/>}
                  </div>
                </div>
              ))
            )}
          </div>
        )}

        {step === 1 && (
          <div>
            <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:12, display:'flex', alignItems:'center', gap:6 }}>
              <IC.Card c={T.green} s={16}/> Moyen de paiement
            </div>
            {payMethods.map((m, i) => (
              <div key={i} onClick={() => setPayMethod(i)} style={{ background:T.white, borderRadius:14, padding:'14px 16px', marginBottom:10, display:'flex', alignItems:'center', gap:14, border:`1.5px solid ${payMethod===i ? T.green : T.border}`, cursor:'pointer', transition:'border 0.2s' }}>
                <div style={{ width:40, height:40, borderRadius:12, background:T.tag, display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <m.Icon c={T.green} s={20}/>
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:14, fontWeight:600, color:T.text }}>{m.label}</div>
                  {m.sub && <div style={{ fontSize:12, color:T.muted }}>{m.sub}</div>}
                </div>
                <div style={{ width:20, height:20, borderRadius:'50%', border:`2px solid ${payMethod===i ? T.green : T.border}`, background: payMethod===i ? T.green : 'transparent', display:'flex', alignItems:'center', justifyContent:'center' }}>
                  {payMethod===i && <IC.Check c={T.white} s={10}/>}
                </div>
              </div>
            ))}

            {/* Récap commande */}
            <div style={{ background:T.white, borderRadius:14, padding:'14px 16px', marginTop:8 }}>
              <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:10 }}>Récapitulatif</div>
              {commune && (
                <div style={{ fontSize:12, color:T.muted, marginBottom:8, display:'flex', alignItems:'center', gap:4 }}>
                  <IC.Pin c={T.muted} s={10}/> {commune}
                  {rue && ` · ${rue}`}
                </div>
              )}
              {slots[selectedSlot] && (
                <div style={{ fontSize:12, color:T.muted, marginBottom:10, display:'flex', alignItems:'center', gap:4 }}>
                  <IC.Clock c={T.muted} s={10}/> {slots[selectedSlot].label}
                </div>
              )}
              {cartItems.map(i => (
                <div key={i.id} style={{ display:'flex', justifyContent:'space-between', marginBottom:7, alignItems:'center', gap:8 }}>
                  <div style={{ width:32, height:32, borderRadius:8, overflow:'hidden', flexShrink:0 }}>
                    <Img src={i.img} style={{ width:'100%', height:'100%' }}/>
                  </div>
                  <span style={{ fontSize:12, color:T.muted, flex:1 }}>{i.name} ×{i.qty}</span>
                  <span style={{ fontSize:13, fontWeight:600, color:T.text }}>€{(i.price*i.qty).toFixed(2)}</span>
                </div>
              ))}
              <div style={{ borderTop:`1px solid ${T.border}`, paddingTop:10, marginTop:6, display:'flex', justifyContent:'space-between' }}>
                <span style={{ fontSize:15, fontWeight:800 }}>Total</span>
                <span style={{ fontSize:15, fontWeight:800, color:T.green }}>€{(total+delivery).toFixed(2)}</span>
              </div>
            </div>
          </div>
        )}
      </div>

      <div style={{ padding:'14px 16px 20px', background:T.white, borderTop:`1px solid ${T.border}`, flexShrink:0 }}>
        <button
          onClick={() => step < 1 ? setStep(1) : setStep(2)}
          disabled={step === 0 && (slots.length === 0 || selectedSlot === null)}
          style={{
            width:'100%', height:54, borderRadius:16, border:'none',
            background: (step === 0 && (slots.length === 0 || selectedSlot === null)) ? '#ccc' : T.terra,
            color:T.white, fontSize:16, fontWeight:700, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          }}>
          {step === 0 ? 'Continuer →' : 'Confirmer la commande'}
        </button>
      </div>
    </div>
  );
}

// ─── 6. PROFILE ───────────────────────────────────────────────

          <div style={{ display:'flex', alignItems:'center', gap:16 }}>

              <Img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=128&h=128&fit=crop&crop=face" style={{ width:'100%', height:'100%' }}/>
            </div>
            <div>
              <div style={{ fontSize:18, fontWeight:800, color:T.white }}>Marie Dubois</div>

            </div>
          </div>
          <div style={{ display:'flex', gap:0, marginTop:22, background:'rgba(255,255,255,0.1)', borderRadius:14, overflow:'hidden' }}>
            {[{ n:'12', l:'Commandes' }, { n:'4', l:'Fermes' }, { n:'38', l:'Produits' }].map((s,i) => (

              <div style={{ width:38, height:38, borderRadius:11, background:T.tag, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>

      </div>
      <BottomNav active="profile" onNav={onNav}/>

// ─── ROOT APP ─────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState(() => localStorage.getItem('fn_screen') || 'splash');
  const [product, setProduct] = useState(null);
  const [cart, setCart] = useState(() => { try { return JSON.parse(localStorage.getItem('fn_cart') || '[]'); } catch { return []; } });

  useEffect(() => { localStorage.setItem('fn_screen', screen); }, [screen]);
  useEffect(() => { localStorage.setItem('fn_cart', JSON.stringify(cart)); }, [cart]);

  function addToCart(p, qty) {
    setCart(prev => {
      const ex = prev.find(i => i.id === p.id);
      return ex ? prev.map(i => i.id===p.id ? {...i, qty:i.qty+qty} : i) : [...prev, {...p, qty}];
    });
  }
  function nav(s) { setScreen(s); if (s !== 'product') setProduct(null); }

  const cartCount = cart.reduce((s,i) => s+i.qty, 0);

  return (
    <IOSDevice width={393} height={852}>
      {screen==='splash'   && <SplashScreen onDone={() => nav('home')}/>}
      {screen==='home'     && <HomeScreen onProduct={p => { setProduct(p); nav('product'); }} cartCount={cartCount} onNav={nav}/>}
      {screen==='product'  && product && <ProductScreen product={product} onBack={() => nav('home')} onAddToCart={addToCart} cartItems={cart}/>}
      {screen==='cart'     && <CartScreen cartItems={cart} onRemove={id => setCart(c=>c.filter(i=>i.id!==id))} onChangeQty={(id,q) => { if(q<1){setCart(c=>c.filter(i=>i.id!==id));return;} setCart(c=>c.map(i=>i.id===id?{...i,qty:q}:i)); }} onCheckout={() => nav('checkout')} onBack={() => nav('home')}/>}
      {screen==='checkout' && <CheckoutScreen cartItems={cart} onConfirm={() => { setCart([]); nav('home'); }} onBack={() => nav('cart')}/>}
      {screen==='profile'  && <ProfileScreen onNav={nav}/>}
      {screen==='search'   && <HomeScreen onProduct={p => { setProduct(p); nav('product'); }} cartCount={cartCount} onNav={nav}/>}
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
