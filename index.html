// ─── GEO ──────────────────────────────────────────────────────
function haversine(lat1,lon1,lat2,lon2){const R=6371,dL=(lat2-lat1)*Math.PI/180,dO=(lon2-lon1)*Math.PI/180,a=Math.sin(dL/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
const COURIER_KMH=25, PREP_MIN=5, MAX_KM=10;
function delivMin(km){return Math.ceil(PREP_MIN+(km/COURIER_KMH)*60);}

// ─── HEURE BRUXELLES ──────────────────────────────────────────
function getBxlTime(){const s=new Date().toLocaleString('fr-BE',{timeZone:'Europe/Brussels',hour:'2-digit',minute:'2-digit',hour12:false});const[h,m]=s.split(':').map(Number);return{hour:h,minute:m,tot:h*60+m};}
function getSlots(){const{tot}=getBxlTime();const ALL=[{label:"Aujourd'hui  12h–14h",day:'today',cH:10,cM:0},{label:"Aujourd'hui  17h–19h",day:'today',cH:15,cM:0},{label:"Aujourd'hui  19h–21h",day:'today',cH:17,cM:0},{label:"Demain  8h–10h",day:'tomorrow',cH:99,cM:0},{label:"Demain  12h–14h",day:'tomorrow',cH:99,cM:0},{label:"Demain  17h–19h",day:'tomorrow',cH:99,cM:0}];return ALL.map(s=>{if(s.day!=='today')return{...s,available:true,urgency:null};const left=s.cH*60+s.cM-tot;if(left<=0)return{...s,available:false,urgency:null};return{...s,available:true,urgency:left<=60?'last':left<=120?'soon':null};}).filter(s=>s.available);}
function getCountdown(){const{tot}=getBxlTime();const sl=getSlots().filter(s=>s.day==='today');if(!sl.length)return null;const n=sl[0],diff=n.cH*60+n.cM-tot;if(diff<=0)return null;return{label:n.label,h:Math.floor(diff/60),m:diff%60,urgency:n.urgency};}

// ─── SHARED ───────────────────────────────────────────────────
function BottomNav({active,onNav,cartCount=0}){const tabs=[{id:'home',Icon:IC.Home,label:'Accueil'},{id:'search',Icon:IC.Search,label:'Explorer'},{id:'cart',Icon:IC.Cart,label:'Panier',badge:cartCount},{id:'profile',Icon:IC.User,label:'Profil'}];return(<div style={{display:'flex',background:T.white,borderTop:`1px solid ${T.border}`,paddingBottom:28,paddingTop:10,flexShrink:0}}>{tabs.map(t=>(<div key={t.id} onClick={()=>onNav(t.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer',position:'relative'}}><t.Icon c={active===t.id?T.green:'#c0c0b0'} s={22}/>{t.badge>0&&<div style={{position:'absolute',top:-2,right:'22%',width:16,height:16,borderRadius:'50%',background:T.terra,fontSize:9,fontWeight:800,color:T.white,display:'flex',alignItems:'center',justifyContent:'center'}}>{t.badge}</div>}<span style={{fontSize:10,color:active===t.id?T.green:'#c0c0b0',fontWeight:active===t.id?700:400}}>{t.label}</span></div>))}</div>);}
function Img({src,style={}}){return <img src={src} style={{objectFit:'cover',...style}} loading="lazy"/>;}
function DBadge({km,style={}}){const m=delivMin(km);const c=m<=20?T.green:m<=30?T.amber:T.express;return(<div style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(255,255,255,.92)',borderRadius:9,padding:'3px 8px',...style}}><IC.Clock c={c} s={11}/><span style={{fontSize:11,fontWeight:700,color:c}}>{m} min</span></div>);}

// ─── ÉCRAN GEO ────────────────────────────────────────────────
function GeoScreen({onLocated}){
  const[status,setStatus]=useState('idle');
  const[commune,setCommune]=useState('');
  const[search,setSearch]=useState('');
  const[waitEmail,setWaitEmail]=useState('');
  const[waitSent,setWaitSent]=useState(false);
  const[outPos,setOutPos]=useState(null);

  function checkCov({lat,lng,source,communeName}){
    const inRange=FARMS.filter(f=>haversine(lat,lng,f.lat,f.lng)<=MAX_KM);
    if(inRange.length===0){setOutPos({lat,lng,source,communeName});setStatus('out');return;}
    onLocated({lat,lng,source,communeName});
  }
  function reqGPS(){setStatus('loading');if(!navigator.geolocation){setStatus('error');return;}navigator.geolocation.getCurrentPosition(p=>checkCov({lat:p.coords.latitude,lng:p.coords.longitude,source:'gps'}),()=>setStatus('error'),{timeout:8000});}
  function confirmCommune(){const c=COMMUNES.find(c=>c.name===commune);if(c)checkCov({lat:c.lat,lng:c.lng,source:'manual',communeName:c.name});}
  const filtered=COMMUNES.filter(c=>c.name.toLowerCase().includes(search.toLowerCase()));

  if(status==='out'){
    if(waitSent)return(<div style={{height:'100%',background:T.green,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,animation:'fade-in .4s ease'}}><div style={{width:72,height:72,borderRadius:'50%',background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20}}><IC.Check c={T.white} s={34}/></div><div style={{fontSize:22,fontWeight:800,color:T.white,textAlign:'center',marginBottom:8}}>Vous êtes sur la liste !</div><div style={{fontSize:14,color:'rgba(255,255,255,.7)',textAlign:'center',lineHeight:1.7}}>Nous vous préviendrons dès que FarmNow est disponible dans votre zone.</div></div>);
    return(
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream,animation:'fade-in .3s ease'}}>
        <div style={{background:T.green,padding:'64px 24px 24px',flexShrink:0}}><div style={{display:'flex',alignItems:'center',gap:10}}><IC.Leaf c={T.white} s={22}/><span style={{fontSize:20,fontWeight:800,color:T.white}}>FarmNow</span></div></div>
        <div style={{flex:1,overflowY:'auto',padding:24,display:'flex',flexDirection:'column',alignItems:'center'}}>
          <div style={{width:80,height:80,borderRadius:'50%',background:'#fef3c7',border:'2px solid #fde68a',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,marginTop:16}}><IC.Warning c={T.amber} s={36}/></div>
          <div style={{fontSize:20,fontWeight:800,color:T.text,textAlign:'center',marginBottom:10}}>Zone non couverte</div>
          <div style={{fontSize:14,color:T.muted,textAlign:'center',lineHeight:1.7,marginBottom:24}}>Aucune de nos fermes partenaires ne se trouve à moins de 10 km de votre position pour le moment.<br/><br/>Laissez votre email et nous vous préviendrons dès que FarmNow arrive près de chez vous !</div>
          <div style={{width:'100%',background:T.white,borderRadius:16,padding:'14px 16px',marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:T.text,marginBottom:10}}>Fermes les plus proches de vous</div>
            {FARMS.map(f=>({...f,km:outPos?haversine(outPos.lat,outPos.lng,f.lat,f.lng):99})).sort((a,b)=>a.km-b.km).slice(0,3).map(f=>(
              <div key={f.id} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <div style={{width:36,height:36,borderRadius:10,overflow:'hidden',flexShrink:0}}><Img src={f.img} style={{width:'100%',height:'100%'}}/></div>
                <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:T.text}}>{f.name}</div><div style={{fontSize:11,color:T.muted}}>{f.location}</div></div>
                <div style={{fontSize:12,fontWeight:700,color:T.muted}}>{f.km.toFixed(1)} km</div>
              </div>
            ))}
          </div>
          <div style={{width:'100%',background:T.white,borderRadius:16,padding:'16px'}}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:12}}><IC.Mail c={T.green} s={16}/><span style={{fontSize:13,fontWeight:700,color:T.text}}>M'avertir quand disponible</span></div>
            <input type="email" placeholder="votre@email.com" value={waitEmail} onChange={e=>setWaitEmail(e.target.value)} style={{width:'100%',height:44,borderRadius:12,border:`1.5px solid ${T.border}`,padding:'0 14px',fontSize:14,color:T.text,background:T.cream,outline:'none',fontFamily:'inherit',marginBottom:10}}/>
            <button onClick={()=>waitEmail.includes('@')&&setWaitSent(true)} style={{width:'100%',height:48,borderRadius:14,border:'none',background:T.terra,color:T.white,fontSize:15,fontWeight:700,cursor:'pointer'}}>Me prévenir →</button>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream}}>
      <div style={{background:T.green,padding:'64px 24px 28px',flexShrink:0}}>

}

// ─── BANNER EXPRESS ───────────────────────────────────────────
function ExpressBanner(){const[cd,setCd]=useState(getCountdown());useEffect(()=>{const id=setInterval(()=>setCd(getCountdown()),60000);return()=>clearInterval(id);},[]);if(!cd)return null;const u=cd.urgency==='last';return(<div style={{margin:'12px 16px 0',borderRadius:16,padding:'12px 16px',background:u?'linear-gradient(135deg,#c8402a,#e84c1e)':'linear-gradient(135deg,#3d5c35,#5a7a4e)',display:'flex',alignItems:'center',gap:12,animation:'slide-up .4s ease'}}><div style={{width:8,height:8,borderRadius:'50%',background:'rgba(255,255,255,.9)',animation:'pulse-dot 1.4s ease-in-out infinite',flexShrink:0}}/><div style={{flex:1}}><div style={{display:'flex',alignItems:'center',gap:4,marginBottom:2}}><IC.Lightning c="rgba(255,255,255,.9)" s={10}/><span style={{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.85)',letterSpacing:1.1,textTransform:'uppercase'}}>{u?'Dernière chance !':'Livraison express'}</span></div><div style={{fontSize:13,fontWeight:700,color:'#fff'}}>{cd.label}</div></div><div style={{background:'rgba(0,0,0,.18)',borderRadius:12,padding:'7px 12px',textAlign:'center',flexShrink:0}}><div style={{fontSize:18,fontWeight:900,color:'#fff',fontVariantNumeric:'tabular-nums'}}>{cd.h>0?`${cd.h}h${String(cd.m).padStart(2,'0')}`:`${cd.m}min`}</div><div style={{fontSize:9,color:'rgba(255,255,255,.6)',marginTop:1,fontWeight:600}}>pour commander</div></div></div>);}

:14,cursor:'pointer'}}>Passer</div>}</div></div>);}

// ─── PRODUCT DETAIL ───────────────────────────────────────────
function ProductScreen({product,onBack,onAddToCart,cartItems,userPos}){
  const farm=FARMS.find(f=>f.id===product.farm);
  const km=userPos&&farm?haversine(userPos.lat,userPos.lng,farm.lat,farm.lng):null;
  const dm=km!==null?delivMin(km):null;
  const inCart=cartItems.find(i=>i.id===product.id);
  const[qty,setQty]=useState(inCart?inCart.qty:1);
  const[added,setAdded]=useState(false);
  const nextSlot=getSlots()[0];
  function handleAdd(){onAddToCart(product,qty);setAdded(true);setTimeout(()=>setAdded(false),1600);}
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.white}}>
      <div style={{height:260,position:'relative',flexShrink:0,overflow:'hidden'}}>
        <Img src={product.img} style={{width:'100%',height:'100%'}}/>
        <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,.18) 0%,transparent 50%)'}}/>

        {dm!==null&&(<div style={{position:'absolute',bottom:14,left:16,background:dm<=30?T.green:T.amber,borderRadius:12,padding:'6px 12px',display:'flex',alignItems:'center',gap:6}}><IC.Clock c={T.white} s={13}/><span style={{fontSize:13,fontWeight:800,color:T.white}}>{dm} min</span><span style={{fontSize:11,color:'rgba(255,255,255,.7)'}}>· {km.toFixed(1)} km</span></div>)}
        <div style={{position:'absolute',top:58,right:16,background:T.tag,borderRadius:10,padding:'5px 10px',display:'flex',alignItems:'center',gap:5}}><IC.Leaf c={T.green} s={14}/><span style={{fontSize:12,fontWeight:700,color:T.green}}>Bio</span></div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'18px 20px 0'}}>
        <div style={{fontSize:10,letterSpacing:1.5,fontWeight:700,color:T.terra,textTransform:'uppercase',marginBottom:4}}>{product.cat}</div>
        <div style={{fontSize:24,fontWeight:800,color:T.text,letterSpacing:-.3,lineHeight:1.2}}>{product.name}</div>
        <div style={{fontSize:13,color:T.muted,marginTop:2,marginBottom:12}}>{product.name_en}</div>
        {nextSlot&&(<div style={{background:nextSlot.urgency==='last'?'#fff0ec':T.tag,borderRadius:12,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8,border:`1px solid ${nextSlot.urgency==='last'?'#f5c0a8':'#c8e0c0'}`}}><IC.Lightning c={nextSlot.urgency==='last'?T.express:T.green} s={14}/><div><div style={{fontSize:12,fontWeight:700,color:nextSlot.urgency==='last'?T.express:T.green}}>{nextSlot.urgency==='last'?"Dernière chance aujourd'hui !":'Express disponible'}</div><div style={{fontSize:11,color:T.muted}}>Créneau : {nextSlot.label}</div></div></div>)}
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:T.tag,borderRadius:14,marginBottom:12}}>
          <div style={{width:42,height:42,borderRadius:12,overflow:'hidden',flexShrink:0}}><Img src={farm?.img} style={{width:'100%',height:'100%'}}/></div>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:T.text}}>{farm?.name}</div><div style={{fontSize:11,color:T.muted,display:'flex',alignItems:'center',gap:3,marginTop:1}}><IC.Pin c={T.muted} s={10}/>{farm?.location}{km!==null&&<span>· {km.toFixed(1)} km de vous</span>}</div></div>
          <div style={{display:'flex',alignItems:'center',gap:3}}><IC.Star s={12}/><span style={{fontSize:12,fontWeight:700}}>{farm?.rating}</span></div>

          <div><span style={{fontSize:26,fontWeight:800,color:T.green}}>€{product.price.toFixed(2)}</span><span style={{fontSize:13,color:T.muted,marginLeft:4}}>/ {product.unit}</span></div>

            <div onClick={()=>setQty(Math.max(1,qty-1))} style={{cursor:'pointer',fontSize:20,fontWeight:700,color:T.green,lineHeight:1}}>−</div>

// ─── CART ─────────────────────────────────────────────────────
function CartScreen({cartItems,onRemove,onChangeQty,onCheckout,onBack,userPos}){
  const total=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const dFree=total>=30,delivery=dFree?0:3.90;
  const todaySlots=getSlots().filter(s=>s.day==='today');
  const maxDm=cartItems.reduce((mx,item)=>{const f=FARMS.find(x=>x.id===item.farm);if(!f||!userPos)return mx;return Math.max(mx,delivMin(haversine(userPos.lat,userPos.lng,f.lat,f.lng)));},0);
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream}}>
      <div style={{padding:'60px 20px 16px',background:T.white,borderBottom:`1px solid ${T.border}`,flexShrink:0}}><div style={{display:'flex',alignItems:'center',gap:12}}><div onClick={onBack} style={{cursor:'pointer'}}><IC.Back/></div><div style={{fontSize:20,fontWeight:800,color:T.text}}>Mon Panier</div><div style={{fontSize:13,color:T.muted,marginLeft:'auto'}}>{cartItems.length} article{cartItems.length!==1?'s':''}</div></div></div>
      <div style={{flex:1,overflowY:'auto'}}>
        {cartItems.length===0?(<div style={{textAlign:'center',marginTop:100,padding:'0 40px'}}><div style={{width:80,height:80,borderRadius:'50%',background:T.tag,margin:'0 auto 16px',display:'flex',alignItems:'center',justifyContent:'center'}}><IC.Cart c={T.muted} s={36}/></div><div style={{fontSize:17,fontWeight:700,color:T.text,marginBottom:6}}>Votre panier est vide</div><div style={{fontSize:13,color:T.muted}}>Ajoutez des produits frais pour commencer</div></div>):(
          <div style={{padding:'12px 16px'}}>
            {maxDm>0&&(<div style={{background:maxDm<=30?'#eef6ea':'#fff3cd',borderRadius:14,padding:'12px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:10,border:`1.5px solid ${maxDm<=30?'#c8e0c0':'#fde68a'}`}}><IC.Truck c={maxDm<=30?T.green:T.amber} s={18}/><div><div style={{fontSize:13,fontWeight:700,color:maxDm<=30?T.green:T.amber}}>Livraison estimée : {maxDm} min {maxDm<=30?'✓':''}</div><div style={{fontSize:11,color:T.muted}}>{maxDm<=30?'Toutes les fermes sont dans votre rayon':'Basé sur la ferme la plus éloignée'}</div></div></div>)}
            {todaySlots.length>0&&(<div style={{background:todaySlots[0].urgency==='last'?'#fff0ec':T.tag,borderRadius:14,padding:'11px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8,border:`1.5px solid ${todaySlots[0].urgency==='last'?'#f5c0a8':'#c8e0c0'}`}}><IC.Lightning c={todaySlots[0].urgency==='last'?T.express:T.green} s={16}/><div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:todaySlots[0].urgency==='last'?T.express:T.green}}>{todaySlots[0].urgency==='last'?"Dernière chance express aujourd'hui !":'Express disponible !'}</div><div style={{fontSize:11,color:T.muted}}>{todaySlots[0].label}</div></div></div>)}
            {!dFree?(<div style={{background:T.white,borderRadius:14,padding:'12px 14px',marginBottom:12}}><div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}><IC.Truck c={T.terra} s={16}/><span style={{fontSize:12,color:T.terra,fontWeight:600}}>Plus que €{(30-total).toFixed(2)} pour la livraison gratuite</span></div><div style={{height:4,borderRadius:2,background:T.tag}}><div style={{height:'100%',borderRadius:2,background:T.terra,width:`${Math.min(100,(total/30)*100)}%`,transition:'width .3s'}}/></div></div>):(<div style={{background:'#eef6ea',borderRadius:14,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8}}><IC.Check c={T.green} s={16}/><span style={{fontSize:12,color:T.green,fontWeight:700}}>Livraison gratuite débloquée !</span></div>)}
            {cartItems.map(item=>{const f=FARMS.find(x=>x.id===item.farm);const d=userPos&&f?haversine(userPos.lat,userPos.lng,f.lat,f.lng):null;const dm2=d!==null?delivMin(d):null;return(<div key={item.id} style={{background:T.white,borderRadius:16,padding:'12px',marginBottom:10,display:'flex',gap:12,alignItems:'center'}}>
              <div style={{width:60,height:60,borderRadius:12,overflow:'hidden',flexShrink:0}}><Img src={item.img} style={{width:'100%',height:'100%'}}/></div>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:2}}>{item.name}</div><div style={{fontSize:11,color:T.muted,marginBottom:4}}>{f?.name}{dm2!==null&&<span style={{color:dm2<=30?T.green:T.amber,fontWeight:700}}> · {dm2} min</span>}</div><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{display:'flex',alignItems:'center',gap:10,background:T.tag,borderRadius:10,padding:'5px 10px'}}><div onClick={()=>onChangeQty(item.id,item.qty-1)} style={{cursor:'pointer',fontSize:16,fontWeight:700,color:T.green}}>−</div><span style={{fontSize:13,fontWeight:700,color:T.text,minWidth:14,textAlign:'center'}}>{item.qty}</span><div onClick={()=>onChangeQty(item.id,item.qty+1)} style={{cursor:'pointer',fontSize:16,fontWeight:700,color:T.green}}>+</div></div><span style={{fontSize:14,fontWeight:800,color:T.green}}>€{(item.price*item.qty).toFixed(2)}</span></div></div>
              <div onClick={()=>onRemove(item.id)} style={{cursor:'pointer',padding:6}}><IC.Trash/></div>
            </div>);})}
          </div>
        )}
      </div>
      {cartItems.length>0&&(<div style={{padding:'14px 16px 20px',background:T.white,borderTop:`1px solid ${T.border}`,flexShrink:0}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span style={{fontSize:13,color:T.muted}}>Sous-total</span><span style={{fontSize:13,fontWeight:600}}>€{total.toFixed(2)}</span></div><div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}><span style={{fontSize:13,color:T.muted}}>Livraison</span><span style={{fontSize:13,color:dFree?T.green:T.text,fontWeight:600}}>{dFree?'Gratuit':'€3.90'}</span></div><div style={{display:'flex',justifyContent:'space-between',paddingTop:12,borderTop:`1px solid ${T.border}`,marginBottom:16}}><span style={{fontSize:16,fontWeight:800}}>Total</span><span style={{fontSize:18,fontWeight:800,color:T.green}}>€{(total+delivery).toFixed(2)}</span></div><button onClick={onCheckout} style={{width:'100%',height:54,borderRadius:16,border:'none',background:T.terra,color:T.white,fontSize:16,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><IC.Truck c={T.white} s={18}/> Commander →</button></div>)}
    </div>
  );
}

// ─── CHECKOUT ─────────────────────────────────────────────────
function CheckoutScreen({cartItems,onConfirm,onBack,userPos}){
  const[step,setStep]=useState(0);
  const[rue,setRue]=useState('');
  const[payMethod,setPayMethod]=useState(0);
  const total=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const delivery=total>=30?0:3.90;
  const slots=getSlots();
  const[selSlot,setSelSlot]=useState(slots.length>0?0:null);
  const pays=[{label:'Carte bancaire',sub:'Visa / Mastercard',Icon:IC.Card},{label:'Bancontact',sub:'Paiement local belge',Icon:IC.Card},{label:'PayPal',sub:'',Icon:IC.Card}];
  const maxDm=cartItems.reduce((mx,item)=>{const f=FARMS.find(x=>x.id===item.farm);if(!f||!userPos)return mx;return Math.max(mx,delivMin(haversine(userPos.lat,userPos.lng,f.lat,f.lng)));},0);
  const loc=userPos?.communeName||'Votre position';

  if(step===2){const cs=slots[selSlot]||slots[0];return(<div style={{height:'100%',background:T.green,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,position:'relative',overflow:'hidden',animation:'fade-in .4s ease'}}><div style={{position:'absolute',top:-80,right:-80,width:280,height:280,borderRadius:'50%',background:'rgba(255,255,255,.05)'}}/><div style={{position:'absolute',bottom:-60,left:-60,width:240,height:240,borderRadius:'50%',background:'rgba(255,255,255,.04)'}}/><div style={{width:80,height:80,borderRadius:'50%',background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:24}}><IC.Check c={T.white} s={38}/></div><div style={{fontSize:26,fontWeight:800,color:T.white,textAlign:'center',marginBottom:8}}>Commande confirmée !</div><div style={{fontSize:14,color:'rgba(255,255,255,.7)',textAlign:'center',marginBottom:10}}>{loc}{rue?` · ${rue}`:''}</div><div style={{background:'rgba(255,255,255,.12)',borderRadius:16,padding:'14px 20px',textAlign:'center',marginBottom:6}}>{maxDm>0&&<div style={{fontSize:32,fontWeight:900,color:T.white,marginBottom:4}}>{maxDm} min</div>}<div style={{fontSize:13,color:'rgba(255,255,255,.8)'}}>Livraison estimée</div>{cs&&<div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>Créneau : {cs.label}</div>}</div><div style={{fontSize:30,fontWeight:800,color:T.white,marginTop:12}}>€{(total+delivery).toFixed(2)}</div><button onClick={onConfirm} style={{marginTop:36,width:'100%',height:54,borderRadius:16,border:'none',background:T.terra,color:T.white,fontSize:16,fontWeight:700,cursor:'pointer'}}>Retour à l'accueil</button></div>);}

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream}}>
      <div style={{padding:'60px 20px 16px',background:T.white,borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}><div onClick={onBack} style={{cursor:'pointer'}}><IC.Back/></div><div style={{fontSize:20,fontWeight:800,color:T.text}}>Livraison Express</div></div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>{['Adresse & créneau','Paiement'].map((s,i)=>(<React.Fragment key={i}>{i>0&&<div style={{flex:1,height:2,background:step>0?T.green:T.border,borderRadius:1,transition:'background .3s'}}/>}<div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:22,height:22,borderRadius:'50%',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',background:step>=i?T.green:T.tag,color:step>=i?T.white:T.muted}}>{step>i?<IC.Check c={T.white} s={12}/>:i+1}</div><span style={{fontSize:12,fontWeight:600,color:step>=i?T.green:T.muted}}>{s}</span></div></React.Fragment>))}</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
        {step===0&&(<div>
          <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:10,display:'flex',alignItems:'center',gap:6}}><IC.Pin c={T.green} s={14}/> Adresse de livraison</div>
          <div style={{background:T.white,borderRadius:14,padding:'12px 14px',marginBottom:10,display:'flex',alignItems:'center',gap:10,border:`1.5px solid ${T.border}`}}><IC.GPS c={T.green} s={16}/><div><div style={{fontSize:13,fontWeight:700,color:T.text}}>{loc}</div><div style={{fontSize:11,color:T.muted}}>{userPos?.source==='gps'?'Position GPS détectée':'Commune sélectionnée'}</div></div></div>
          <input placeholder="Rue et numéro" value={rue} onChange={e=>setRue(e.target.value)} style={{width:'100%',height:46,borderRadius:14,border:`1.5px solid ${T.border}`,padding:'0 14px',fontSize:14,color:T.text,background:T.white,outline:'none',fontFamily:'inherit',marginBottom:16}}/>
          {maxDm>0&&(<div style={{background:maxDm<=30?'#eef6ea':'#fff3cd',borderRadius:12,padding:'10px 14px',marginBottom:16,display:'flex',alignItems:'center',gap:8,border:`1px solid ${maxDm<=30?'#c8e0c0':'#fde68a'}`}}><IC.Clock c={maxDm<=30?T.green:T.amber} s={14}/><span style={{fontSize:12,fontWeight:700,color:maxDm<=30?T.green:T.amber}}>Livraison estimée : {maxDm} min depuis la ferme</span></div>)}
          <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:10,display:'flex',alignItems:'center',gap:6}}><IC.Clock c={T.green} s={14}/> Créneau de livraison</div>
          {slots.length===0?(<div style={{background:'#fff0ec',borderRadius:14,padding:'14px 16px',border:`1px solid #f5c0a8`}}><div style={{fontSize:13,fontWeight:700,color:T.express,marginBottom:4}}>Plus de livraison express ce soir</div><div style={{fontSize:12,color:T.muted}}>Des créneaux seront disponibles demain dès 8h.</div></div>):slots.map((s,i)=>(<div key={i} onClick={()=>setSelSlot(i)} style={{background:T.white,borderRadius:14,padding:'13px 16px',marginBottom:10,display:'flex',alignItems:'center',justifyContent:'space-between',border:`1.5px solid ${selSlot===i?T.green:T.border}`,cursor:'pointer',transition:'border .2s'}}><div style={{flex:1}}><div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}><span style={{fontSize:14,color:T.text,fontWeight:selSlot===i?700:400}}>{s.label}</span>{s.urgency==='last'&&(<div style={{background:'#fff0ec',borderRadius:6,padding:'1px 6px',display:'flex',alignItems:'center',gap:3}}><IC.Lightning c={T.express} s={9}/><span style={{fontSize:9,fontWeight:800,color:T.express}}>Dernière chance</span></div>)}{s.urgency==='soon'&&(<div style={{background:T.tag,borderRadius:6,padding:'1px 6px'}}><span style={{fontSize:9,fontWeight:700,color:T.green}}>Bientôt fermé</span></div>)}</div>{s.day==='today'&&<div style={{fontSize:11,color:T.muted}}>Commandez avant {s.cH}h</div>}</div><div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${selSlot===i?T.green:T.border}`,background:selSlot===i?T.green:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{selSlot===i&&<IC.Check c={T.white} s={10}/>}</div></div>))}
        </div>)}
        {step===1&&(<div>
          <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IC.Card c={T.green} s={16}/> Moyen de paiement</div>
          {pays.map((m,i)=>(<div key={i} onClick={()=>setPayMethod(i)} style={{background:T.white,borderRadius:14,padding:'14px 16px',marginBottom:10,display:'flex',alignItems:'center',gap:14,border:`1.5px solid ${payMethod===i?T.green:T.border}`,cursor:'pointer'}}><div style={{width:40,height:40,borderRadius:12,background:T.tag,display:'flex',alignItems:'center',justifyContent:'center'}}><m.Icon c={T.green} s={20}/></div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:T.text}}>{m.label}</div>{m.sub&&<div style={{fontSize:12,color:T.muted}}>{m.sub}</div>}</div><div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${payMethod===i?T.green:T.border}`,background:payMethod===i?T.green:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>{payMethod===i&&<IC.Check c={T.white} s={10}/>}</div></div>))}
          <div style={{background:T.white,borderRadius:14,padding:'14px 16px',marginTop:8}}>
            <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:10}}>Récapitulatif</div>
            <div style={{fontSize:12,color:T.muted,marginBottom:4,display:'flex',alignItems:'center',gap:4}}><IC.GPS c={T.muted} s={10}/>{loc}{rue?` · ${rue}`:''}</div>
            {slots[selSlot]&&<div style={{fontSize:12,color:T.muted,marginBottom:8,display:'flex',alignItems:'center',gap:4}}><IC.Clock c={T.muted} s={10}/>{slots[selSlot].label}{maxDm>0&&<span style={{color:maxDm<=30?T.green:T.amber,fontWeight:700}}> · {maxDm} min</span>}</div>}
            {cartItems.map(i=>(<div key={i.id} style={{display:'flex',justifyContent:'space-between',marginBottom:7,alignItems:'center',gap:8}}><div style={{width:32,height:32,borderRadius:8,overflow:'hidden',flexShrink:0}}><Img src={i.img} style={{width:'100%',height:'100%'}}/></div><span style={{fontSize:12,color:T.muted,flex:1}}>{i.name} ×{i.qty}</span><span style={{fontSize:13,fontWeight:600}}>€{(i.price*i.qty).toFixed(2)}</span></div>))}
            <div style={{borderTop:`1px solid ${T.border}`,paddingTop:10,marginTop:6,display:'flex',justifyContent:'space-between'}}><span style={{fontSize:15,fontWeight:800}}>Total</span><span style={{fontSize:15,fontWeight:800,color:T.green}}>€{(total+delivery).toFixed(2)}</span></div>
          </div>
        </div>)}
      </div>
      <div style={{padding:'14px 16px 20px',background:T.white,borderTop:`1px solid ${T.border}`,flexShrink:0}}>
        <button onClick={()=>step<1?setStep(1):setStep(2)} disabled={step===0&&(slots.length===0||selSlot===null)} style={{width:'100%',height:54,borderRadius:16,border:'none',background:(step===0&&(slots.length===0||selSlot===null))?'#ccc':T.terra,color:T.white,fontSize:16,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          {step===0?'Continuer →':'Confirmer la commande'}
        </button>
      </div>
    </div>
  );
}

// ─── PROFILE ──────────────────────────────────────────────────
function ProfileScreen({onNav,userPos}){
  const orders=[{id:'#FN-2841',date:'18 Avr 2026',items:'Tomates cerises, Fraises',total:'€8.00',status:'Livré',min:22},{id:'#FN-2798',date:'12 Avr 2026',items:'Poulet fermier, Œufs bio',total:'€19.30',status:'Livré',min:28}];
  const settings=[{Icon:IC.GPS,label:'Ma position',sub:userPos?.communeName||'Modifier la zone de livraison'},{Icon:IC.Card,label:'Paiement',sub:'Modes de paiement'},{Icon:IC.Bell,label:'Notifications',sub:'Alertes créneaux & promos'},{Icon:IC.Heart,label:'Fermes favorites',sub:'Fermes sauvegardées'}];
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream}}>
      <div style={{flex:1,overflowY:'auto'}}>
        <div style={{background:T.green,padding:'64px 20px 28px'}}>
          <div style={{display:'flex',alignItems:'center',gap:16}}><div style={{width:64,height:64,borderRadius:'50%',overflow:'hidden',border:'2.5px solid rgba(255,255,255,.3)',flexShrink:0}}><Img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=128&h=128&fit=crop&crop=face" style={{width:'100%',height:'100%'}}/></div><div><div style={{fontSize:18,fontWeight:800,color:T.white}}>Marie Dubois</div><div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginTop:2,display:'flex',alignItems:'center',gap:4}}><IC.Pin c="rgba(255,255,255,.5)" s={11}/>{userPos?.communeName||'Bruxelles'}</div></div></div>
          <div style={{display:'flex',gap:0,marginTop:22,background:'rgba(255,255,255,.1)',borderRadius:14,overflow:'hidden'}}>{[{n:'12',l:'Commandes'},{n:'4',l:'Fermes'},{n:'38',l:'Produits'}].map((s,i)=>(<div key={s.l} style={{flex:1,textAlign:'center',padding:'12px 0',borderRight:i<2?'1px solid rgba(255,255,255,.15)':'none'}}><div style={{fontSize:20,fontWeight:800,color:T.white}}>{s.n}</div><div style={{fontSize:11,color:'rgba(255,255,255,.55)',marginTop:2}}>{s.l}</div></div>))}</div>
        </div>
        <div style={{padding:'16px'}}>
          <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:12}}>Commandes récentes</div>
          {orders.map(o=>(<div key={o.id} style={{background:T.white,borderRadius:14,padding:'14px',marginBottom:10}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontSize:13,fontWeight:700,color:T.text}}>{o.id}</span><span style={{fontSize:12,fontWeight:700,color:T.green,background:T.tag,padding:'2px 8px',borderRadius:8}}>{o.status}</span></div><div style={{fontSize:12,color:T.muted,marginBottom:2}}>{o.date} · <span style={{color:T.green,fontWeight:600}}>livré en {o.min} min</span></div><div style={{fontSize:12,color:T.muted}}>{o.items}</div><div style={{fontSize:14,fontWeight:700,color:T.green,marginTop:4}}>{o.total}</div></div>))}
          <div style={{fontSize:15,fontWeight:700,color:T.text,margin:'18px 0 12px'}}>Paramètres</div>
          {settings.map(s=>(<div key={s.label} style={{background:T.white,borderRadius:14,padding:'14px 16px',marginBottom:8,display:'flex',alignItems:'center',gap:12,cursor:'pointer'}}><div style={{width:38,height:38,borderRadius:11,background:T.tag,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><s.Icon c={T.green} s={18}/></div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:T.text}}>{s.label}</div><div style={{fontSize:11,color:T.muted}}>{s.sub}</div></div><IC.ChevronR c={T.muted} s={14}/></div>))}
        </div>
      </div>
      <BottomNav active="profile" onNav={onNav}/>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('splash');
  const[product,setProduct]=useState(null);
  const[userPos,setUserPos]=useState(null);
  const[cart,setCart]=useState(()=>{try{return JSON.parse(localStorage.getItem('fn_cart')||'[]');}catch{return[];}});
  useEffect(()=>{localStorage.setItem('fn_cart',JSON.stringify(cart));},[cart]);
  function addToCart(p,qty){setCart(prev=>{const ex=prev.find(i=>i.id===p.id);return ex?prev.map(i=>i.id===p.id?{...i,qty:i.qty+qty}:i):[...prev,{...p,qty}];});}
  function nav(s){setScreen(s);if(s!=='product')setProduct(null);}
  const cartCount=cart.reduce((s,i)=>s+i.qty,0);
  return(
    <IOSDevice width={393} height={852}>
      {screen==='splash'   && <SplashScreen onDone={()=>nav('geo')}/>}
      {screen==='geo'      && <GeoScreen onLocated={pos=>{setUserPos(pos);nav('home');}}/>}
      {screen==='home'     && <HomeScreen onProduct={p=>{setProduct(p);nav('product');}} cartCount={cartCount} onNav={nav} userPos={userPos}/>}
      {screen==='product'  && product && <ProductScreen product={product} onBack={()=>nav('home')} onAddToCart={addToCart} cartItems={cart} userPos={userPos}/>}
      {screen==='cart'     && <CartScreen cartItems={cart} onRemove={id=>setCart(c=>c.filter(i=>i.id!==id))} onChangeQty={(id,q)=>{if(q<1){setCart(c=>c.filter(i=>i.id!==id));return;}setCart(c=>c.map(i=>i.id===id?{...i,qty:q}:i));}} onCheckout={()=>nav('checkout')} onBack={()=>nav('home')} userPos={userPos}/>}
      {screen==='checkout' && <CheckoutScreen cartItems={cart} onConfirm={()=>{setCart([]);nav('home');}} onBack={()=>nav('cart')} userPos={userPos}/>}
      {screen==='profile'  && <ProfileScreen onNav={nav} userPos={userPos}/>}
      {screen==='search'   && <HomeScreen onProduct={p=>{setProduct(p);nav('product');}} cartCount={cartCount} onNav={nav} userPos={userPos}/>}
    </IOSDevice>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
