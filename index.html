// ─── GEO + DELIVERY TIME ──────────────────────────────────────
function haversine(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
const COURIER_KMH=25, PREP_MIN=5, MAX_KM=10;
function delivMin(km){return Math.ceil(PREP_MIN+(km/COURIER_KMH)*60);}

// Heure Bruxelles réelle
function getBxlNow(){
  const now=new Date();
  const s=now.toLocaleString('fr-BE',{timeZone:'Europe/Brussels',hour:'2-digit',minute:'2-digit',hour12:false});
  const[h,m]=s.split(':').map(Number);
  return {h,m,label:`${String(h).padStart(2,'0')}h${String(m).padStart(2,'0')}`};
}
// Heure d'arrivée = maintenant + X minutes
function arrivalTime(addMin){
  const now=new Date();
  now.setMinutes(now.getMinutes()+addMin);
  const s=now.toLocaleString('fr-BE',{timeZone:'Europe/Brussels',hour:'2-digit',minute:'2-digit',hour12:false});
  const[h,m]=s.split(':').map(Number);
  return `${String(h).padStart(2,'0')}h${String(m).padStart(2,'0')}`;
}

// Plage horaire de service : 7h–21h (Bruxelles)

}
function Img({src,style={}}){return <img src={src} style={{objectFit:'cover',...style}} loading="lazy"/>;}

// Badge "X min" coloré selon urgence
function DBadge({km,style={}}){
  const m=delivMin(km);
  const c=m<=20?T.green:m<=30?T.amber:T.express;
  return(<div style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(255,255,255,.93)',borderRadius:9,padding:'3px 8px',...style}}><IC.Clock c={c} s={11}/><span style={{fontSize:11,fontWeight:800,color:c}}>{m} min</span></div>);
}

// ─── ÉCRAN GEO ────────────────────────────────────────────────
function GeoScreen({onLocated}){
  const[status,setStatus]=useState('idle');
  const[commune,setCommune]=useState('');
  const[search,setSearch]=useState('');
  const[waitEmail,setWaitEmail]=useState('');
  const[waitSent,setWaitSent]=useState(false);
  const[outPos,setOutPos]=useState(null);
  function checkCov({lat,lng,source,communeName}){const inRange=FARMS.filter(f=>haversine(lat,lng,f.lat,f.lng)<=MAX_KM);if(inRange.length===0){setOutPos({lat,lng,source,communeName});setStatus('out');return;}onLocated({lat,lng,source,communeName});}
  function reqGPS(){setStatus('loading');if(!navigator.geolocation){setStatus('error');return;}navigator.geolocation.getCurrentPosition(p=>checkCov({lat:p.coords.latitude,lng:p.coords.longitude,source:'gps'}),()=>setStatus('error'),{timeout:8000});}
  function confirmCommune(){const c=COMMUNES.find(c=>c.name===commune);if(c)checkCov({lat:c.lat,lng:c.lng,source:'manual',communeName:c.name});}
  const filtered=COMMUNES.filter(c=>c.name.toLowerCase().includes(search.toLowerCase()));
  if(status==='out'){
    if(waitSent)return(<div style={{height:'100%',background:T.green,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,animation:'fade-in .4s ease'}}><div style={{width:72,height:72,borderRadius:'50%',background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20}}><IC.Check c={T.white} s={34}/></div><div style={{fontSize:22,fontWeight:800,color:T.white,textAlign:'center',marginBottom:8}}>Vous êtes sur la liste !</div><div style={{fontSize:14,color:'rgba(255,255,255,.7)',textAlign:'center',lineHeight:1.7}}>Nous vous préviendrons dès que FarmNow arrive dans votre zone.</div></div>);

'center',gap:6,marginBottom:12}}><IC.Mail c={T.green} s={16}/><span style={{fontSize:13,fontWeight:700,color:T.text}}>M'avertir quand disponible</span></div><input type="email" placeholder="votre@email.com" value={waitEmail} onChange={e=>setWaitEmail(e.target.value)} style={{width:'100%',height:44,borderRadius:12,border:`1.5px solid ${T.border}`,padding:'0 14px',fontSize:14,color:T.text,background:T.cream,outline:'none',fontFamily:'inherit',marginBottom:10}}/><button onClick={()=>waitEmail.includes('@')&&setWaitSent(true)} style={{width:'100%',height:48,borderRadius:14,border:'none',background:T.terra,color:T.white,fontSize:15,fontWeight:700,cursor:'pointer'}}>Me prévenir →</button></div></div></div>);
  }
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream}}>
      <div style={{background:T.green,padding:'64px 24px 28px',flexShrink:0}}><div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}><IC.Leaf c={T.white} s={22}/><span style={{fontSize:20,fontWeight:800,color:T.white}}>FarmNow</span><div style={{background:'rgba(200,97,58,.9)',borderRadius:8,padding:'2px 8px',display:'flex',alignItems:'center',gap:3,marginLeft:4}}><IC.Lightning c="#fff" s={9}/><span style={{fontSize:9,fontWeight:800,color:'#fff',letterSpacing:.8}}>EXPRESS</span></div></div><div style={{fontSize:22,fontWeight:800,color:T.white,lineHeight:1.3,marginBottom:8}}>Où souhaitez-vous<br/>être livré ?</div><div style={{fontSize:13,color:'rgba(255,255,255,.65)'}}>Fermes à moins de 10 km · Livraison immédiate en max 30 min.</div></div>
      <div style={{flex:1,overflowY:'auto',padding:20}}>
        <div onClick={()=>status!=='loading'&&reqGPS()} style={{background:status==='loading'?T.greenLight:T.green,borderRadius:16,padding:'18px 20px',marginBottom:14,display:'flex',alignItems:'center',gap:14,cursor:'pointer',animation:'slide-up .3s ease'}}>{status==='loading'?(<div style={{width:40,height:40,borderRadius:'50%',border:'3px solid rgba(255,255,255,.3)',borderTopColor:'#fff',animation:'spin .8s linear infinite',flexShrink:0}}/>):(<div style={{width:40,height:40,borderRadius:12,background:'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><IC.GPS c={T.white} s={20}/></div>)}<div><div style={{fontSize:15,fontWeight:700,color:T.white}}>{status==='loading'?'Localisation en cours…':'Utiliser ma position GPS'}</div><div style={{fontSize:12,color:'rgba(255,255,255,.65)',marginTop:2}}>Recommandé — précis et instantané</div></div></div>
        {status==='error'&&<div style={{background:'#fff3cd',borderRadius:12,padding:'10px 14px',marginBottom:14,fontSize:12,color:'#856404',animation:'slide-up .2s ease'}}>GPS non autorisé. Choisissez votre commune ci-dessous.</div>}
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}><div style={{flex:1,height:1,background:T.border}}/><span style={{fontSize:12,color:T.muted,fontWeight:600}}>ou choisir manuellement</span><div style={{flex:1,height:1,background:T.border}}/></div>
        <div style={{background:T.white,borderRadius:14,padding:'0 14px',display:'flex',alignItems:'center',gap:10,height:44,marginBottom:12,border:`1.5px solid ${T.border}`}}><IC.Search c={T.muted} s={16}/><input placeholder="Rechercher votre commune…" value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,border:'none',outline:'none',fontSize:14,color:T.text,background:'transparent',fontFamily:'inherit'}}/></div>
        <div style={{background:T.white,borderRadius:16,overflow:'hidden',marginBottom:16}}>{filtered.map((c,i)=>(<div key={c.name} onClick={()=>setCommune(c.name)} style={{padding:'13px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:i<filtered.length-1?`1px solid ${T.border}`:'none',cursor:'pointer',background:commune===c.name?T.tag:T.white}}><div style={{display:'flex',alignItems:'center',gap:10}}><IC.Pin c={commune===c.name?T.green:T.muted} s={13}/><span style={{fontSize:14,fontWeight:commune===c.name?700:400,color:T.text}}>{c.name}</span></div>{commune===c.name&&<IC.Check c={T.green} s={14}/>}</div>))}</div>
        {commune&&<button onClick={confirmCommune} style={{width:'100%',height:52,borderRadius:16,border:'none',background:T.terra,color:T.white,fontSize:16,fontWeight:700,cursor:'pointer',animation:'slide-up .2s ease'}}>Confirmer — {commune} →</button>}
      </div>
    </div>
  );
}

:14,cursor:'pointer'}}>Passer</div>}</div></div>);}

          <div><div style={{fontSize:12,fontWeight:700,color:T.text}}>{nearFarms.length} ferme{nearFarms.length!==1?'s':''} dans votre rayon</div><div style={{fontSize:11,color:T.muted}}>{nearFarms.length>0?`Livraison la plus rapide : ${delivMin(nearFarms[0].km||2)} min`:'Aucune ferme disponible'}</div></div>

// ─── PRODUCT DETAIL ───────────────────────────────────────────
function ProductScreen({product,onBack,onAddToCart,cartItems,userPos}){
  const farm=FARMS.find(f=>f.id===product.farm);
  const km=userPos&&farm?haversine(userPos.lat,userPos.lng,farm.lat,farm.lng):null;
  const dm=km!==null?delivMin(km):null;
  const arrival=dm!==null?arrivalTime(dm):null;
  const[qty,setQty]=useState(1);
  const[added,setAdded]=useState(false);
  function handleAdd(){onAddToCart(product,qty);setAdded(true);setTimeout(()=>setAdded(false),1600);}
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.white}}>
      <div style={{height:260,position:'relative',flexShrink:0,overflow:'hidden'}}><Img src={product.img} style={{width:'100%',height:'100%'}}/><div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,.18) 0%,transparent 50%)'}}/><div onClick={onBack} style={{position:'absolute',top:58,left:16,width:40,height:40,borderRadius:12,background:'rgba(255,255,255,.9)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:'0 2px 8px rgba(0,0,0,.12)'}}><IC.Back/></div>
        {dm!==null&&(<div style={{position:'absolute',bottom:14,left:16,background:dm<=30?T.green:T.amber,borderRadius:12,padding:'6px 14px',display:'flex',alignItems:'center',gap:7}}><IC.Clock c={T.white} s={13}/><span style={{fontSize:13,fontWeight:800,color:T.white}}>{dm} min</span><div style={{width:1,height:14,background:'rgba(255,255,255,.35)'}}/><span style={{fontSize:13,fontWeight:700,color:'rgba(255,255,255,.85)'}}>avant {arrival}</span></div>)}
        <div style={{position:'absolute',top:58,right:16,background:T.tag,borderRadius:10,padding:'5px 10px',display:'flex',alignItems:'center',gap:5}}><IC.Leaf c={T.green} s={14}/><span style={{fontSize:12,fontWeight:700,color:T.green}}>Bio</span></div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'18px 20px 0'}}>
        <div style={{fontSize:10,letterSpacing:1.5,fontWeight:700,color:T.terra,textTransform:'uppercase',marginBottom:4}}>{product.cat}</div>
        <div style={{fontSize:24,fontWeight:800,color:T.text,letterSpacing:-.3,lineHeight:1.2}}>{product.name}</div>
        <div style={{fontSize:13,color:T.muted,marginTop:2,marginBottom:12}}>{product.name_en}</div>
        {/* Livraison immédiate pill */}
        {dm!==null&&isServiceOpen()&&(<div style={{background:T.tag,borderRadius:12,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8,border:`1px solid #c8e0c0`}}><IC.Bike c={T.green} s={16}/><div><div style={{fontSize:12,fontWeight:700,color:T.green}}>Livraison immédiate disponible</div><div style={{fontSize:11,color:T.muted,marginTop:1}}>Commandez maintenant → livré avant <strong style={{color:T.green}}>{arrival}</strong></div></div></div>)}
        {!isServiceOpen()&&(<div style={{background:'#f5f5f0',borderRadius:12,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8,border:`1px solid ${T.border}`}}><IC.Clock c={T.muted} s={14}/><div style={{fontSize:12,color:T.muted}}>Service disponible de <strong>7h à 21h</strong></div></div>)}
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:T.tag,borderRadius:14,marginBottom:12}}><div style={{width:42,height:42,borderRadius:12,overflow:'hidden',flexShrink:0}}><Img src={farm?.img} style={{width:'100%',height:'100%'}}/></div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:T.text}}>{farm?.name}</div><div style={{fontSize:11,color:T.muted,display:'flex',alignItems:'center',gap:3,marginTop:1}}><IC.Pin c={T.muted} s={10}/>{farm?.location}{km!==null&&<span>· {km.toFixed(1)} km</span>}</div></div><div style={{display:'flex',alignItems:'center',gap:3}}><IC.Star s={12}/><span style={{fontSize:12,fontWeight:700}}>{farm?.rating}</span></div></div>
        <div style={{fontSize:14,color:'#4a4a3a',lineHeight:1.65}}>{product.desc}</div>
      </div>
      <div style={{padding:'14px 20px 20px',borderTop:`1px solid ${T.border}`}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div><span style={{fontSize:26,fontWeight:800,color:T.green}}>€{product.price.toFixed(2)}</span><span style={{fontSize:13,color:T.muted,marginLeft:4}}>/ {product.unit}</span></div>

      </div>
    </div>
  );
}

// ─── CART ─────────────────────────────────────────────────────
function CartScreen({cartItems,onRemove,onChangeQty,onCheckout,onBack,userPos}){
  const total=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const dFree=total>=30,delivery=dFree?0:3.90;
  const maxDm=cartItems.reduce((mx,item)=>{const f=FARMS.find(x=>x.id===item.farm);if(!f||!userPos)return mx;return Math.max(mx,delivMin(haversine(userPos.lat,userPos.lng,f.lat,f.lng)));},0);
  const arrival=maxDm>0?arrivalTime(maxDm):null;
  const open=isServiceOpen();
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream}}>

          <div style={{padding:'12px 16px'}}>
            {/* Heure d'arrivée estimée — la pièce centrale */}

              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:'#a8f08a',animation:'pulse-dot 1.2s ease-in-out infinite',flexShrink:0}}/>
                <span style={{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.75)',letterSpacing:1.1,textTransform:'uppercase'}}>Livraison immédiate</span>
              </div>
              <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between'}}>
                <div>
                  <div style={{fontSize:13,color:'rgba(255,255,255,.7)',marginBottom:4}}>Vous commandez maintenant à <strong style={{color:T.white}}>{getBxlNow().label}</strong></div>
                  <div style={{fontSize:22,fontWeight:900,color:T.white}}>Livré avant <span style={{color:'#a8f08a'}}>{arrival}</span></div>
                  <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>({maxDm} min · un coursier part immédiatement)</div>
                </div>
                <IC.Bike c="rgba(255,255,255,.7)" s={36}/>
              </div>
            </div>)}
            {maxDm>0&&!open&&(<div style={{background:'#f5f5f0',borderRadius:14,padding:'12px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8,border:`1px solid ${T.border}`}}><IC.Clock c={T.muted} s={16}/><div style={{fontSize:12,color:T.muted}}>Service disponible de <strong>7h à 21h</strong>. Votre panier sera prêt dès l'ouverture.</div></div>)}
            {!dFree?(<div style={{background:T.white,borderRadius:14,padding:'12px 14px',marginBottom:12}}><div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}><IC.Truck c={T.terra} s={16}/><span style={{fontSize:12,color:T.terra,fontWeight:600}}>Plus que €{(30-total).toFixed(2)} pour la livraison gratuite</span></div><div style={{height:4,borderRadius:2,background:T.tag}}><div style={{height:'100%',borderRadius:2,background:T.terra,width:`${Math.min(100,(total/30)*100)}%`,transition:'width .3s'}}/></div></div>):(<div style={{background:'#eef6ea',borderRadius:14,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8}}><IC.Check c={T.green} s={16}/><span style={{fontSize:12,color:T.green,fontWeight:700}}>Livraison gratuite débloquée !</span></div>)}
            {cartItems.map(item=>{const f=FARMS.find(x=>x.id===item.farm);const d=userPos&&f?haversine(userPos.lat,userPos.lng,f.lat,f.lng):null;const dm2=d!==null?delivMin(d):null;return(<div key={item.id} style={{background:T.white,borderRadius:16,padding:'12px',marginBottom:10,display:'flex',gap:12,alignItems:'center'}}><div style={{width:60,height:60,borderRadius:12,overflow:'hidden',flexShrink:0}}><Img src={item.img} style={{width:'100%',height:'100%'}}/></div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:2}}>{item.name}</div><div style={{fontSize:11,color:T.muted,marginBottom:4}}>{f?.name}{dm2!==null&&<span style={{color:dm2<=30?T.green:T.amber,fontWeight:700}}> · {dm2} min</span>}</div><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{display:'flex',alignItems:'center',gap:10,background:T.tag,borderRadius:10,padding:'5px 10px'}}><div onClick={()=>onChangeQty(item.id,item.qty-1)} style={{cursor:'pointer',fontSize:16,fontWeight:700,color:T.green}}>−</div><span style={{fontSize:13,fontWeight:700,color:T.text,minWidth:14,textAlign:'center'}}>{item.qty}</span><div onClick={()=>onChangeQty(item.id,item.qty+1)} style={{cursor:'pointer',fontSize:16,fontWeight:700,color:T.green}}>+</div></div><span style={{fontSize:14,fontWeight:800,color:T.green}}>€{(item.price*item.qty).toFixed(2)}</span></div></div><div onClick={()=>onRemove(item.id)} style={{cursor:'pointer',padding:6}}><IC.Trash/></div></div>);})}
          </div>
        )}
      </div>
      {cartItems.length>0&&(<div style={{padding:'14px 16px 20px',background:T.white,borderTop:`1px solid ${T.border}`,flexShrink:0}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><span style={{fontSize:13,color:T.muted}}>Sous-total</span><span style={{fontSize:13,fontWeight:600}}>€{total.toFixed(2)}</span></div><div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}><span style={{fontSize:13,color:T.muted}}>Livraison</span><span style={{fontSize:13,color:dFree?T.green:T.text,fontWeight:600}}>{dFree?'Gratuit':'€3.90'}</span></div><div style={{display:'flex',justifyContent:'space-between',paddingTop:12,borderTop:`1px solid ${T.border}`,marginBottom:16}}><span style={{fontSize:16,fontWeight:800}}>Total</span><span style={{fontSize:18,fontWeight:800,color:T.green}}>€{(total+delivery).toFixed(2)}</span></div><button onClick={onCheckout} style={{width:'100%',height:54,borderRadius:16,border:'none',background:T.terra,color:T.white,fontSize:16,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><IC.Truck c={T.white} s={18}/> Commander →</button></div>)}
    </div>
  );
}

// ─── CHECKOUT ─────────────────────────────────────────────────
// Plus de créneau — juste adresse + paiement + confirmation avec notif coursier
function CheckoutScreen({cartItems,onConfirm,onBack,userPos}){
  const[step,setStep]=useState(0); // 0=adresse 1=paiement 2=notif coursier 3=confirmé
  const[rue,setRue]=useState('');
  const[payMethod,setPayMethod]=useState(0);
  const[notifStep,setNotifStep]=useState(0); // animation notif coursier
  const total=cartItems.reduce((s,i)=>s+i.price*i.qty,0);
  const delivery=total>=30?0:3.90;
  const pays=[{label:'Carte bancaire',sub:'Visa / Mastercard',Icon:IC.Card},{label:'Bancontact',sub:'Paiement local belge',Icon:IC.Card},{label:'PayPal',sub:'',Icon:IC.Card}];
  const maxDm=cartItems.reduce((mx,item)=>{const f=FARMS.find(x=>x.id===item.farm);if(!f||!userPos)return mx;return Math.max(mx,delivMin(haversine(userPos.lat,userPos.lng,f.lat,f.lng)));},0);
  const arrival=arrivalTime(maxDm>0?maxDm:25);
  const orderTime=getBxlNow().label;
  const loc=userPos?.communeName||'Votre position';

  // Étape 2 : animation "notification coursier reçue"
  useEffect(()=>{
    if(step!==2)return;
    const t1=setTimeout(()=>setNotifStep(1),600);   // notif apparaît
    const t2=setTimeout(()=>setNotifStep(2),2200);  // coursier accepte
    const t3=setTimeout(()=>setNotifStep(3),3800);  // confirmation
    const t4=setTimeout(()=>setStep(3),4600);       // écran final
    return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);clearTimeout(t4);};
  },[step]);

  // ── Étape 2 : Simulation notification coursier ──
  if(step===2){return(
    <div style={{height:'100%',background:'#0f1a0c',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse at center,rgba(61,92,53,.35) 0%,transparent 70%)'}}/>
      {/* Icône coursier pulsante */}
      <div style={{position:'relative',marginBottom:32,zIndex:2}}>
        <div style={{width:90,height:90,borderRadius:'50%',background:'rgba(61,92,53,.4)',border:`2px solid ${T.green}`,display:'flex',alignItems:'center',justifyContent:'center',animation:notifStep>=1?'blink-ring 1.2s ease-in-out 2':'none'}}>
          <IC.Bike c={T.white} s={40}/>
        </div>
        {notifStep>=2&&<div style={{position:'absolute',top:-4,right:-4,width:26,height:26,borderRadius:'50%',background:'#22c55e',display:'flex',alignItems:'center',justifyContent:'center',animation:'pop-in .35s ease'}}><IC.Check c={T.white} s={12}/></div>}
      </div>
      {/* Notification push simulée */}
      {notifStep>=1&&(
        <div style={{width:'100%',background:'rgba(255,255,255,.07)',backdropFilter:'blur(12px)',borderRadius:18,padding:'14px 16px',marginBottom:20,border:'1px solid rgba(255,255,255,.1)',animation:'notif-slide .4s ease',zIndex:2}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
            <div style={{width:34,height:34,borderRadius:10,background:T.green,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><IC.Phone c={T.white} s={16}/></div>
            <div><div style={{fontSize:12,fontWeight:700,color:'rgba(255,255,255,.9)'}}>FarmNow · Coursier</div><div style={{fontSize:10,color:'rgba(255,255,255,.4)'}}>maintenant</div></div>
          </div>
          <div style={{fontSize:13,color:'rgba(255,255,255,.8)',lineHeight:1.5}}>
            {notifStep===1&&"🔔 Nouvelle commande reçue — préparation en cours…"}
            {notifStep>=2&&"✅ Commande acceptée ! Votre coursier prépare la livraison."}
          </div>
          {notifStep>=2&&(<div style={{marginTop:10,height:3,borderRadius:2,background:'rgba(255,255,255,.15)',overflow:'hidden'}}><div style={{height:'100%',background:'#22c55e',borderRadius:2,animation:'progress 1.6s ease forwards'}}/></div>)}
        </div>
      )}
      <div style={{textAlign:'center',zIndex:2}}>
        <div style={{fontSize:14,color:'rgba(255,255,255,.45)',marginBottom:6}}>{notifStep===0&&'Envoi de la commande…'}{notifStep===1&&'Recherche d\'un coursier…'}{notifStep===2&&'Coursier assigné !'}{notifStep>=3&&'C\'est parti ! 🚀'}</div>
        <div style={{fontSize:20,fontWeight:800,color:T.white}}>{notifStep>=2?`Livraison avant ${arrival}`:'Traitement en cours…'}</div>
      </div>
    </div>
  );}

  // ── Étape 3 : Écran de confirmation finale ──
  if(step===3){return(
    <div style={{height:'100%',background:T.green,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,position:'relative',overflow:'hidden',animation:'fade-in .5s ease'}}>
      <div style={{position:'absolute',top:-80,right:-80,width:280,height:280,borderRadius:'50%',background:'rgba(255,255,255,.05)'}}/>
      <div style={{position:'absolute',bottom:-60,left:-60,width:240,height:240,borderRadius:'50%',background:'rgba(255,255,255,.04)'}}/>
      <div style={{width:80,height:80,borderRadius:'50%',background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,animation:'pop-in .5s ease'}}><IC.Check c={T.white} s={38}/></div>
      <div style={{fontSize:26,fontWeight:800,color:T.white,textAlign:'center',marginBottom:6,letterSpacing:-.3}}>Commande confirmée !</div>
      <div style={{fontSize:13,color:'rgba(255,255,255,.65)',textAlign:'center',marginBottom:20}}>{loc}{rue?` · ${rue}`:''}</div>
      {/* Bloc temps réel */}
      <div style={{width:'100%',background:'rgba(255,255,255,.1)',borderRadius:20,padding:'20px',marginBottom:20,textAlign:'center'}}>
        <div style={{fontSize:12,fontWeight:700,color:'rgba(255,255,255,.6)',letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>Vous avez commandé à</div>
        <div style={{fontSize:22,fontWeight:900,color:T.white,marginBottom:12}}>{orderTime}</div>
        <div style={{width:'100%',height:1,background:'rgba(255,255,255,.15)',marginBottom:12}}/>
        <div style={{fontSize:12,fontWeight:700,color:'rgba(255,255,255,.6)',letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>Livraison estimée avant</div>
        <div style={{fontSize:36,fontWeight:900,color:'#a8f08a',letterSpacing:-.5}}>{arrival}</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginTop:6}}>dans environ {maxDm} min · coursier en route</div>
      </div>
      <div style={{fontSize:32,fontWeight:800,color:T.white,marginBottom:24}}>€{(total+delivery).toFixed(2)}</div>
      <button onClick={onConfirm} style={{width:'100%',height:54,borderRadius:16,border:'none',background:T.terra,color:T.white,fontSize:16,fontWeight:700,cursor:'pointer'}}>Retour à l'accueil</button>
    </div>
  );}

  // ── Étapes 0 et 1 : adresse + paiement ──
  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:T.cream}}>
      <div style={{padding:'60px 20px 16px',background:T.white,borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}><div onClick={onBack} style={{cursor:'pointer'}}><IC.Back/></div><div style={{fontSize:20,fontWeight:800,color:T.text}}>Livraison immédiate</div></div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>{['Adresse','Paiement'].map((s,i)=>(<React.Fragment key={i}>{i>0&&<div style={{flex:1,height:2,background:step>0?T.green:T.border,borderRadius:1,transition:'background .3s'}}/>}<div style={{display:'flex',alignItems:'center',gap:5}}><div style={{width:22,height:22,borderRadius:'50%',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',background:step>=i?T.green:T.tag,color:step>=i?T.white:T.muted}}>{step>i?<IC.Check c={T.white} s={12}/>:i+1}</div><span style={{fontSize:12,fontWeight:600,color:step>=i?T.green:T.muted}}>{s}</span></div></React.Fragment>))}</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
        {step===0&&(<div>
          {/* Heure d'arrivée prévue bien visible */}
          {maxDm>0&&isServiceOpen()&&(<div style={{background:'linear-gradient(135deg,#3d5c35,#5a7a4e)',borderRadius:16,padding:'14px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
            <IC.Bike c="rgba(255,255,255,.7)" s={28}/>
            <div><div style={{fontSize:12,color:'rgba(255,255,255,.7)',marginBottom:2}}>Vous commandez à {getBxlNow().label}</div><div style={{fontSize:18,fontWeight:900,color:T.white}}>Livré avant <span style={{color:'#a8f08a'}}>{arrival}</span></div><div style={{fontSize:11,color:'rgba(255,255,255,.55)',marginTop:2}}>{maxDm} min · coursier assigné dès confirmation</div></div>
          </div>)}
          <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:10,display:'flex',alignItems:'center',gap:6}}><IC.Pin c={T.green} s={14}/> Adresse de livraison</div>
          <div style={{background:T.white,borderRadius:14,padding:'12px 14px',marginBottom:10,display:'flex',alignItems:'center',gap:10,border:`1.5px solid ${T.border}`}}><IC.GPS c={T.green} s={16}/><div><div style={{fontSize:13,fontWeight:700,color:T.text}}>{loc}</div><div style={{fontSize:11,color:T.muted}}>{userPos?.source==='gps'?'Position GPS détectée':'Commune sélectionnée'}</div></div></div>
          <input placeholder="Rue et numéro (ex: Rue de la Loi 16)" value={rue} onChange={e=>setRue(e.target.value)} style={{width:'100%',height:46,borderRadius:14,border:`1.5px solid ${T.border}`,padding:'0 14px',fontSize:14,color:T.text,background:T.white,outline:'none',fontFamily:'inherit',marginBottom:16}}/>
          {/* Récap articles */}
          <div style={{background:T.white,borderRadius:14,padding:'12px 14px'}}>
            <div style={{fontSize:13,fontWeight:700,color:T.text,marginBottom:10}}>Votre commande</div>
            {cartItems.map(i=>{const f=FARMS.find(x=>x.id===i.farm);const d=userPos&&f?haversine(userPos.lat,userPos.lng,f.lat,f.lng):null;const dm2=d!==null?delivMin(d):null;return(<div key={i.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}><div style={{width:36,height:36,borderRadius:9,overflow:'hidden',flexShrink:0}}><Img src={i.img} style={{width:'100%',height:'100%'}}/></div><div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:T.text}}>{i.name} ×{i.qty}</div><div style={{fontSize:11,color:T.muted}}>{f?.name}{dm2!==null&&<span style={{color:dm2<=30?T.green:T.amber,fontWeight:700}}> · {dm2} min</span>}</div></div><span style={{fontSize:13,fontWeight:700,color:T.green}}>€{(i.price*i.qty).toFixed(2)}</span></div>);})}
          </div>
        </div>)}
        {step===1&&(<div>
          <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:12,display:'flex',alignItems:'center',gap:6}}><IC.Card c={T.green} s={16}/> Moyen de paiement</div>
          {pays.map((m,i)=>(<div key={i} onClick={()=>setPayMethod(i)} style={{background:T.white,borderRadius:14,padding:'14px 16px',marginBottom:10,display:'flex',alignItems:'center',gap:14,border:`1.5px solid ${payMethod===i?T.green:T.border}`,cursor:'pointer'}}><div style={{width:40,height:40,borderRadius:12,background:T.tag,display:'flex',alignItems:'center',justifyContent:'center'}}><m.Icon c={T.green} s={20}/></div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:T.text}}>{m.label}</div>{m.sub&&<div style={{fontSize:12,color:T.muted}}>{m.sub}</div>}</div><div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${payMethod===i?T.green:T.border}`,background:payMethod===i?T.green:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>{payMethod===i&&<IC.Check c={T.white} s={10}/>}</div></div>))}
          <div style={{background:T.white,borderRadius:14,padding:'14px 16px',marginTop:8}}>
            <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:10}}>Récapitulatif</div>
            <div style={{fontSize:12,color:T.muted,marginBottom:4,display:'flex',alignItems:'center',gap:4}}><IC.GPS c={T.muted} s={10}/>{loc}{rue?` · ${rue}`:''}</div>
            <div style={{fontSize:12,color:T.muted,marginBottom:8,display:'flex',alignItems:'center',gap:4}}><IC.Clock c={T.muted} s={10}/>Livraison immédiate · avant <strong style={{color:T.green}}>{arrival}</strong></div>
            {cartItems.map(i=>(<div key={i.id} style={{display:'flex',justifyContent:'space-between',marginBottom:7,alignItems:'center',gap:8}}><div style={{width:32,height:32,borderRadius:8,overflow:'hidden',flexShrink:0}}><Img src={i.img} style={{width:'100%',height:'100%'}}/></div><span style={{fontSize:12,color:T.muted,flex:1}}>{i.name} ×{i.qty}</span><span style={{fontSize:13,fontWeight:600}}>€{(i.price*i.qty).toFixed(2)}</span></div>))}
            <div style={{borderTop:`1px solid ${T.border}`,paddingTop:10,marginTop:6,display:'flex',justifyContent:'space-between'}}><span style={{fontSize:15,fontWeight:800}}>Total</span><span style={{fontSize:15,fontWeight:800,color:T.green}}>€{(total+delivery).toFixed(2)}</span></div>
          </div>
        </div>)}
      </div>
      <div style={{padding:'14px 16px 20px',background:T.white,borderTop:`1px solid ${T.border}`,flexShrink:0}}>
        <button onClick={()=>step<1?setStep(1):setStep(2)} style={{width:'100%',height:54,borderRadius:16,border:'none',background:T.terra,color:T.white,fontSize:16,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          {step===0?'Continuer →':<><IC.Bike c={T.white} s={18}/> Confirmer & notifier le coursier</>}
        </button>
      </div>
    </div>
  );
}

        <div style={{background:T.green,padding:'64px 20px 28px'}}>
          <div style={{display:'flex',alignItems:'center',gap:16}}><div style={{width:64,height:64,borderRadius:'50%',overflow:'hidden',border:'2.5px solid rgba(255,255,255,.3)',flexShrink:0}}><Img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=128&h=128&fit=crop&crop=face" style={{width:'100%',height:'100%'}}/></div><div><div style={{fontSize:18,fontWeight:800,color:T.white}}>Marie Dubois</div><div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginTop:2,display:'flex',alignItems:'center',gap:4}}><IC.Pin c="rgba(255,255,255,.5)" s={11}/>{userPos?.communeName||'Bruxelles'}</div></div></div>
          <div style={{display:'flex',gap:0,marginTop:22,background:'rgba(255,255,255,.1)',borderRadius:14,overflow:'hidden'}}>{[{n:'12',l:'Commandes'},{n:'4',l:'Fermes'},{n:'38',l:'Produits'}].map((s,i)=>(<div key={s.l} style={{flex:1,textAlign:'center',padding:'12px 0',borderRight:i<2?'1px solid rgba(255,255,255,.15)':'none'}}><div style={{fontSize:20,fontWeight:800,color:T.white}}>{s.n}</div><div style={{fontSize:11,color:'rgba(255,255,255,.55)',marginTop:2}}>{s.l}</div></div>))}</div>
        </div>
        <div style={{padding:'16px'}}>
          <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:12}}>Commandes récentes</div>
          {orders.map(o=>(<div key={o.id} style={{background:T.white,borderRadius:14,padding:'14px',marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontSize:13,fontWeight:700,color:T.text}}>{o.id}</span><span style={{fontSize:12,fontWeight:700,color:T.green,background:T.tag,padding:'2px 8px',borderRadius:8}}>{o.status}</span></div>
            <div style={{fontSize:12,color:T.muted,marginBottom:4}}>{o.date}</div>
            {/* Nouveau : affichage heure commande → heure livraison */}
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
              <div style={{fontSize:11,fontWeight:700,color:T.muted,background:T.tag,borderRadius:6,padding:'2px 7px'}}>⏱ {o.orderAt}</div>
              <div style={{flex:1,height:1.5,background:`linear-gradient(to right,${T.green},${T.greenLight})`}}/>
              <div style={{fontSize:11,fontWeight:700,color:T.white,background:T.green,borderRadius:6,padding:'2px 7px'}}>🏁 {o.delivAt}</div>
            </div>
            <div style={{fontSize:12,color:T.muted}}>{o.items}</div>
            <div style={{fontSize:14,fontWeight:700,color:T.green,marginTop:4}}>{o.total}</div>
          </div>))}
          <div style={{fontSize:15,fontWeight:700,color:T.text,margin:'18px 0 12px'}}>Paramètres</div>
          {settings.map(s=>(<div key={s.label} style={{background:T.white,borderRadius:14,padding:'14px 16px',marginBottom:8,display:'flex',alignItems:'center',gap:12,cursor:'pointer'}}><div style={{width:38,height:38,borderRadius:11,background:T.tag,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><s.Icon c={T.green} s={18}/></div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:T.text}}>{s.label}</div><div style={{fontSize:11,color:T.muted}}>{s.sub}</div></div><IC.ChevronR c={T.muted} s={14}/></div>))}
        </div>
      </div>
      <BottomNav active="profile" onNav={onNav}/>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('splash');
  const[product,setProduct]=useState(null);
  const[userPos,setUserPos]=useState(null);
  const[cart,setCart]=useState(()=>{try{return JSON.parse(localStorage.getItem('fn_cart')||'[]');}catch{return[];}});
  useEffect(()=>{localStorage.setItem('fn_cart',JSON.stringify(cart));},[cart]);
  function addToCart(p,qty){setCart(prev=>{const ex=prev.find(i=>i.id===p.id);return ex?prev.map(i=>i.id===p.id?{...i,qty:i.qty+qty}:i):[...prev,{...p,qty}];});}
  function nav(s){setScreen(s);if(s!=='product')setProduct(null);}
  const cartCount=cart.reduce((s,i)=>s+i.qty,0);
  return(
    <IOSDevice width={393} height={852}>
      {screen==='splash'   && <SplashScreen onDone={()=>nav('geo')}/>}
      {screen==='geo'      && <GeoScreen onLocated={pos=>{setUserPos(pos);nav('home');}}/>}
      {screen==='home'     && <HomeScreen onProduct={p=>{setProduct(p);nav('product');}} cartCount={cartCount} onNav={nav} userPos={userPos}/>}
      {screen==='product'  && product && <ProductScreen product={product} onBack={()=>nav('home')} onAddToCart={addToCart} cartItems={cart} userPos={userPos}/>}
      {screen==='cart'     && <CartScreen cartItems={cart} onRemove={id=>setCart(c=>c.filter(i=>i.id!==id))} onChangeQty={(id,q)=>{if(q<1){setCart(c=>c.filter(i=>i.id!==id));return;}setCart(c=>c.map(i=>i.id===id?{...i,qty:q}:i));}} onCheckout={()=>nav('checkout')} onBack={()=>nav('home')} userPos={userPos}/>}
      {screen==='checkout' && <CheckoutScreen cartItems={cart} onConfirm={()=>{setCart([]);nav('home');}} onBack={()=>nav('cart')} userPos={userPos}/>}
      {screen==='profile'  && <ProfileScreen onNav={nav} userPos={userPos}/>}
      {screen==='search'   && <HomeScreen onProduct={p=>{setProduct(p);nav('product');}} cartCount={cartCount} onNav={nav} userPos={userPos}/>}
    </IOSDevice>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
